<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 赛事助手 · 2026</title>
<style>
:root{
  --bg:#0d0e12; --card:#16181f; --card2:#1c1f28; --line:#272b36;
  --txt:#e8eaf0; --dim:#8b93a7; --dim2:#5f6678;
  --red:#e10600; --gold:#ffd15c; --green:#00d17a; --blue:#3d9dff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5; padding:0 0 60px;
}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{
  background:linear-gradient(135deg,#15171e 0%,#1a0f10 100%);
  border-bottom:2px solid var(--red); padding:22px 0 0; margin-bottom:26px;
  position:sticky; top:0; z-index:50;
}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--red)}
.sub{color:var(--dim);font-size:12px;padding-bottom:4px}
.spacer{flex:1}
.btn{
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
  padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;
  font-family:inherit;transition:.15s;
}
.btn:hover{background:#252936;border-color:#39404f}
.btn:disabled{opacity:.5;cursor:default}
.stamp{color:var(--dim2);font-size:11.5px;margin-right:10px;white-space:nowrap}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin-top:18px}
.tab{
  background:none;border:none;color:var(--dim);padding:11px 20px;
  cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;
  border-bottom:3px solid transparent;transition:.15s;border-radius:6px 6px 0 0;
}
.tab:hover{color:var(--txt);background:#ffffff08}
.tab.on{color:#fff;border-bottom-color:var(--red);background:#ffffff0a}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.muted{color:var(--dim);font-size:12.5px;font-weight:400}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11.5px;color:var(--dim);font-weight:600}
.msg{padding:16px 18px;color:var(--dim);font-size:13.5px}
.msg.err{color:#ff8a80}

/* ---------- race list ---------- */
.race{
  display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;
  padding:13px 18px;border-bottom:1px solid #ffffff0a;cursor:pointer;transition:.12s;
}
.race:last-child{border-bottom:none}
.race:hover{background:#ffffff07}
.race.next{background:linear-gradient(90deg,#e1060018,transparent)}
.rd{
  width:44px;height:44px;border-radius:10px;background:var(--card2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;border:1px solid var(--line);flex:none;
}
.rd small{font-size:9px;color:var(--dim2);font-weight:600;letter-spacing:.5px}
.race.next .rd{background:var(--red);border-color:var(--red)}
.race.next .rd small{color:#ffffffaa}
.rname{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rname .en{color:var(--dim2);font-size:11.5px;font-weight:500}
.rmeta{color:var(--dim);font-size:12px;margin-top:2px}
.rflag{font-size:20px;line-height:1}
.rdate{text-align:right;color:var(--dim);font-size:12.5px;white-space:nowrap}
.rdate b{display:block;color:var(--txt);font-size:13.5px;font-weight:600}
.badge{display:inline-block;background:var(--gold);color:#000;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:800;margin-left:6px}
/* 赛程行里的分阶段时间（排位 / 冲刺 / 正赛）。时间统一显示为北京时间 */
.rsess{margin-top:5px;display:flex;flex-direction:column;gap:1px}
.rsess span{display:flex;gap:8px;font-size:11.5px;color:var(--dim);line-height:1.5}
.rsess i{font-style:normal;color:var(--dim2);font-weight:600;min-width:46px;flex:none}
.sess-h .muted{font-weight:400;font-size:12px;margin-left:auto}

/* ---------- results table ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:10px 12px;color:var(--dim);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);
  background:var(--card2);white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid #ffffff08;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.1s}
tbody tr:hover{background:#ffffff07}
.pos{
  font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;
  width:44px;text-align:center;
}
.pos.p1{color:var(--gold)} .pos.p2{color:#cfd4e0} .pos.p3{color:#d08a52}
.pos.pd{color:var(--dim2);font-size:13px}
.dr{display:flex;align-items:center;gap:10px;min-width:190px}
.dr img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top center;background:#22252e;flex:none}
.av{
  width:38px;height:38px;border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:11.5px;font-weight:800;
  color:#0d0e12;letter-spacing:.3px;
}
.dr .nm{font-weight:600;white-space:nowrap}
.dr .cd{color:var(--dim2);font-size:11px;font-weight:700;letter-spacing:.5px}
.team{
  padding-left:9px;border-left:3px solid #444;white-space:nowrap;
  color:var(--dim);font-size:12.5px;
}
.pts{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.num{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.fl{color:#c77dff;font-weight:700;font-size:11px}

/* ---------- standings ---------- */
.bar{height:5px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:5px;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px}

/* ---------- round detail ---------- */
.back{
  background:none;border:none;color:var(--blue);cursor:pointer;font-size:13.5px;
  font-family:inherit;padding:0 0 14px;font-weight:600;
}
.back:hover{text-decoration:underline}
.sess{margin-bottom:20px}
.sess-h{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:var(--card2);border-radius:10px 10px 0 0;font-weight:700;font-size:14px;
  border:1px solid var(--line);border-bottom:none;
}
.sess-h .ln{width:4px;height:16px;border-radius:2px;background:var(--red)}
.sess .card{border-radius:0 0 12px 12px;margin-bottom:0}

footer{text-align:center;color:var(--dim2);font-size:11.5px;margin-top:30px;line-height:1.9}
.hide{display:none!important}

/* 国旗图片（安卓不显示国旗 emoji，统一用图） */
.flag{width:22px;height:15px;border-radius:2px;object-fit:cover;
      vertical-align:-2px;background:#2a2e39;flex:none}

/* ================= 手机适配 ================= */
@media (max-width: 820px){
  body{font-size:13.5px;-webkit-text-size-adjust:100%}
  .wrap{padding:0 12px}

  header{padding:14px 0 0}
  .logo{font-size:19px}
  .sub{display:none}
  .stamp{display:none}
  .btn{padding:7px 11px;font-size:12px}
  .tabs{margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{padding:10px 14px;font-size:13px;white-space:nowrap}

  .card{border-radius:10px;margin-bottom:13px}
  .card-h{padding:11px 13px;font-size:13.5px;flex-wrap:wrap;gap:6px}

  /* 赛程行：日期挪到下一行，避免挤 */
  .race{grid-template-columns:40px 1fr;gap:10px;padding:11px 13px}
  .rd{width:36px;height:36px;font-size:13px;border-radius:8px}
  .rname{font-size:13.5px}
  .rname .en{display:none}
  .rmeta{font-size:11.5px}
  .rsess span{font-size:11px}
  .rsess i{min-width:42px}
  .rdate{grid-column:2;text-align:left;margin-top:3px;font-size:11.5px}
  .rdate b{display:inline;margin-right:6px}

  /* 表格：精准瘦身，不横向溢出 */
  th{padding:7px 6px;font-size:10px;letter-spacing:.2px}
  td{padding:7px 6px;font-size:12.5px}
  .pos{width:30px;font-size:13px}
  .dr{min-width:0;gap:7px}
  .dr img,.av{width:30px;height:30px;font-size:9.5px}
  .dr .nm{font-size:12.5px;white-space:normal;line-height:1.25}
  .dr .cd{font-size:10px}
  .team{font-size:11px;padding-left:6px;border-left-width:2px;white-space:normal}
  .pts{font-size:12.5px}

  /* 隐藏次要列，保证不溢出 */
  th.hide-m, td.hide-m{display:none}

  .sess-h{padding:10px 13px;font-size:13px}
  .back{font-size:13px}
  footer{font-size:10.5px;padding:0 10px}
}

@media (max-width: 420px){
  .dr .nm .cd{display:none}          /* 极窄屏隐藏英文名 */
  th{padding:6px 4px}
  td{padding:6px 4px}
}
</style>

<body>

<header>

    </div>

</div>

</footer>

<script>
"use strict";

/* =========================================================
   配置

const OF1  = "https://api.openf1.org/v1";
const YEAR = 2026;
const LS_KEY   = "f1app2_" + YEAR;      // 换了数据源，缓存键也换
const CACHE_TTL = 5 * 60 * 1000;        // 内存缓存 5 分钟
const SCHEDULE_TTL = 3 * 24 * 60 * 60 * 1000;   // 赛程缓存 3 天

/* =========================================================
   分站中文名
   ========================================================= */
const RACE_CN = {
  "Australian Grand Prix":"澳大利亚大奖赛",
  "Chinese Grand Prix":"中国大奖赛",
  "Japanese Grand Prix":"日本大奖赛",
  "Bahrain Grand Prix":"巴林大奖赛",
  "Saudi Arabian Grand Prix":"沙特阿拉伯大奖赛",
  "Miami Grand Prix":"迈阿密大奖赛",
  "Canadian Grand Prix":"加拿大大奖赛",
  "Monaco Grand Prix":"摩纳哥大奖赛",
  "Barcelona Grand Prix":"巴塞罗那大奖赛",
  "Spanish Grand Prix":"西班牙大奖赛",
  "Austrian Grand Prix":"奥地利大奖赛",
  "British Grand Prix":"英国大奖赛",
  "Belgian Grand Prix":"比利时大奖赛",
  "Hungarian Grand Prix":"匈牙利大奖赛",
  "Dutch Grand Prix":"荷兰大奖赛",

  "Azerbaijan Grand Prix":"阿塞拜疆大奖赛",
  "Singapore Grand Prix":"新加坡大奖赛",
  "United States Grand Prix":"美国大奖赛",
  "Mexico City Grand Prix":"墨西哥城大奖赛",
  "São Paulo Grand Prix":"圣保罗大奖赛",
  "Las Vegas Grand Prix":"拉斯维加斯大奖赛",
  "Qatar Grand Prix":"卡塔尔大奖赛",
  "Abu Dhabi Grand Prix":"阿布扎比大奖赛"
};
/* 2026 特例：API 把在吉隆坡办的这一站命名为 "Bahrain Grand Prix"（上游数据错误），
   按实际举办地 Kuala Lumpur 显示为马来西亚大奖赛 */
const LOCATION_CN_FIX = { "Kuala Lumpur":"马来西亚大奖赛" };

function raceCN(race){
  if(!race) return "";
  if(race.location && LOCATION_CN_FIX[race.location]) return LOCATION_CN_FIX[race.location];
  return RACE_CN[race.name] || race.name || "";
}

/* 车手中文名（按姓氏匹配，因为 OpenF1 只给英文全名） */
const CN_LAST = {
  "ANTONELLI":"安东内利", "RUSSELL":"拉塞尔", "HAMILTON":"汉密尔顿", "NORRIS":"诺里斯",
  "LECLERC":"勒克莱尔", "VERSTAPPEN":"维斯塔潘", "PIASTRI":"皮亚斯特里", "HADJAR":"哈贾尔",
  "LAWSON":"劳森", "GASLY":"加斯利", "LINDBLAD":"林德布拉德", "COLAPINTO":"科拉平托",
  "BEARMAN":"比尔曼", "BORTOLETO":"博尔托莱托", "HULKENBERG":"霍肯伯格", "SAINZ":"塞恩斯",
  "ALBON":"阿尔本", "OCON":"奥康", "ALONSO":"阿隆索", "TSUNODA":"角田裕毅",
  "STROLL":"斯特罗尔", "BOTTAS":"博塔斯", "PEREZ":"佩雷兹", "CRAWFORD":"克劳福德",
  "HERTA":"赫塔", "HIRAKAWA":"平川亮", "ARON":"阿隆", "FORNAROLI":"福纳罗利",
  "VESTI":"维斯蒂", "IWASA":"岩佐步梦", "BROWNING":"布朗宁", "DOOHAN":"杜汉",
  "DRUGOVICH":"德鲁戈维奇", "SHWARTZMAN":"施瓦茨曼", "周冠宇":"周冠宇"
};
function driverCN(fullName){
  if(!fullName) return "";
  const last = fullName.trim().split(/\s+/).pop().toUpperCase();
  return CN_LAST[last] || "";
}

/* ---------- 车手照片 ----------
   直接用 F1 官网的图片 CDN，不经过任何数据源。
   这样不管是 OpenF1 还是备用源 Jolpica，照片都能显示 ——
   Jolpica 本身不提供照片，而 OpenF1 在比赛进行期间会锁站。

   URL 规律（2026 赛季 23 位车手逐个请求验证过，命中 23/23）：
     slug = 名字前 3 字母 + 姓前 3 字母（全小写）
     例：Yuki Tsunoda -> yuktsu，Arvid Lindblad -> arvlin
     {CDN}/{队名}/{slug}01/2026{队名}{slug}01right.webp

   末尾的 01 是官方图的序号，目前全部为 01。
   下赛季车手变动时，新增的人需要按同样规律补一行。 */
const PHOTO_CDN = "https://media.formula1.com/image/upload/c_thumb,g_face,w_300,h_300/q_auto/v1740000001/common/f1/2026";
const PHOTO_BY_NUM = {
  1: "mclaren/lannor01/2026mclarenlannor01right.webp",                   // 诺里斯
  3: "redbullracing/maxver01/2026redbullracingmaxver01right.webp",       // 维斯塔潘
  5: "audi/gabbor01/2026audigabbor01right.webp",                          // 博尔托莱托
  6: "redbullracing/isahad01/2026redbullracingisahad01right.webp",       // 哈贾尔
  10: "alpine/piegas01/2026alpinepiegas01right.webp",                     // 加斯利
  11: "cadillac/serper01/2026cadillacserper01right.webp",                 // 佩雷兹
  12: "mercedes/andant01/2026mercedesandant01right.webp",                 // 安东内利
  14: "astonmartin/feralo01/2026astonmartinferalo01right.webp",           // 阿隆索
  16: "ferrari/chalec01/2026ferrarichalec01right.webp",                   // 勒克莱尔
  18: "astonmartin/lanstr01/2026astonmartinlanstr01right.webp",           // 斯特罗尔
  22: "racingbulls/yuktsu01/2026racingbullsyuktsu01right.webp",           // 角田裕毅
  23: "williams/alealb01/2026williamsalealb01right.webp",                 // 阿尔本
  27: "audi/nichul01/2026audinichul01right.webp",                          // 霍肯伯格
  30: "redbullracing/lialaw01/2026redbullracinglialaw01right.webp",       // 劳森
  31: "haas/estoco01/2026haasestoco01right.webp",                          // 奥康
  41: "racingbulls/arvlin01/2026racingbullsarvlin01right.webp",           // 林德布拉德
  43: "alpine/fracol01/2026alpinefracol01right.webp",                     // 科拉平托
  44: "ferrari/lewham01/2026ferrarilewham01right.webp",                   // 汉密尔顿
  55: "williams/carsai01/2026williamscarsai01right.webp",                 // 塞恩斯
  63: "mercedes/georus01/2026mercedesgeorus01right.webp",                 // 拉塞尔
  77: "cadillac/valbot01/2026cadillacvalbot01right.webp",                 // 博塔斯
  81: "mclaren/oscpia01/2026mclarenoscpia01right.webp",                   // 皮亚斯特里
  87: "haas/olibea01/2026haasolibea01right.webp",                          // 比尔曼
};
/* 带变音符号的名字（Pérez / Hülkenberg）这里写的是去掉重音的形式。
   实测 CDN 两种写法都接受（会自动归一化），取无重音的，
   这样这段源码保持纯 ASCII，不受任何编码环节影响。 */
const photoOf = num => {
  const p = PHOTO_BY_NUM[num];
  return p ? PHOTO_CDN + "/" + p : null;
};

/* 车队中文名 */
const TEAM_CN = {
  "Mercedes":"梅赛德斯", "Ferrari":"法拉利", "McLaren":"迈凯伦",
  "Red Bull Racing":"红牛", "Racing Bulls":"红牛二队", "Alpine":"阿尔派",
  "Audi":"奥迪", "Williams":"威廉姆斯", "Aston Martin":"阿斯顿马丁",
  "Haas F1 Team":"哈斯", "Cadillac":"凯迪拉克", "Sauber":"索伯"
};
/* OpenF1 和 Jolpica 的车队名不一样（"Red Bull Racing" vs "Red Bull"），
   两张表都要查，否则备用源下车队名会漏译成英文。 */
const teamCN = t => TEAM_CN[t] || TEAM_CN_ERGAST[t] || t || "";

/* =========================================================
   工具
   ========================================================= */
const $   = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dash = v => (v === undefined || v === null || v === "") ? "—" : v;

/* =========================================================
   请求层（OpenF1 限流约 30 次/分钟）
   ========================================================= */
const _cache = new Map();
const REQ_TIMEOUT = 30000;      // 单个请求最长 30 秒，避免无限等待

function of1(path, retries = 2){
  const url = OF1 + path;
  const hit = _cache.get(url);
  if(hit && Date.now() - hit.t < CACHE_TTL) return hit.p;

  const p = (async () => {
    for(let i = 0; i <= retries; i++){
      // 用 AbortController 加超时：网络卡住时会中断并重试，不会一直挂着
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), REQ_TIMEOUT);
      try{
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if(r.status === 429 || r.status >= 500){
          if(i < retries){ await new Promise(x => setTimeout(x, 1500 * (i + 1))); continue; }
          throw new Error("接口限流（HTTP " + r.status + "）");
        }
        if(!r.ok) throw new Error("HTTP " + r.status);
        return await r.json();
      }catch(e){
        clearTimeout(timer);
        if(i >= retries){ _cache.delete(url); throw e; }
        await new Promise(x => setTimeout(x, 1500 * (i + 1)));
      }
    }
  })();
  _cache.set(url, { t: Date.now(), p });
  return p;
}

/* =========================================================
   Jolpica 备用源
   ---------------------------------------------------------
   为什么需要：OpenF1 在 F1 比赛进行期间会锁掉整个 API，返回 401
   {"detail":"Live F1 session in progress. Global API access (including
    past sessions) is restricted to authenticated users until the session
    ends."} —— 而那正好是用户最想查成绩的时候。Jolpica 没这个限制。

   Jolpica 是 Ergast 的续作，返回的是 Ergast 那套 MRData 结构。
   代价：没有车手照片、没有车队配色、赛后同步比 OpenF1 慢一些。
   所以它只在 OpenF1 失败时启用，平时完全不参与。
   ========================================================= */
const JOL = "https://api.jolpi.ca/ergast/f1";

function jolGet(path, retries = 2){
  const url = JOL + path;
  const hit = _cache.get(url);
  if(hit && Date.now() - hit.t < CACHE_TTL) return hit.p;
  const p = (async () => {
    for(let i = 0; i <= retries; i++){
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), REQ_TIMEOUT);
      try{
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if(r.status === 429 || r.status >= 500){
          if(i < retries){ await new Promise(x => setTimeout(x, 1200 * (i + 1))); continue; }
          throw new Error("Jolpica 限流（HTTP " + r.status + "）");
        }
        if(!r.ok) throw new Error("HTTP " + r.status);
        return await r.json();
      }catch(e){
        clearTimeout(timer);
        if(i >= retries){ _cache.delete(url); throw e; }
        await new Promise(x => setTimeout(x, 1200 * (i + 1)));
      }
    }
  })();
  _cache.set(url, { t: Date.now(), p });
  return p;
}

/* Jolpica 分页有坑：limit 上限 100，而 offset 是按「返回行数」算的，
   不是按场次。所以想拿整季必须翻页，不能按 round 切。
   每页把 (race, row) 拆平存下来，后面按 round 归类。 */
async function jolPaged(path, key, maxPages = 16){
  const out = [];
  let total = Infinity;
  for(let page = 0; page < maxPages; page++){
    const sep = path.includes("?") ? "&" : "?";
    const j = await jolGet(`${path}${sep}limit=100&offset=${page * 100}`);
    const MR = j && j.MRData;
    if(!MR) break;
    total = parseInt(MR.total || "0", 10) || 0;
    const races = (MR.RaceTable && MR.RaceTable.Races) || [];
    let got = 0;
    for(const race of races){
      const list = race[key];
      if(!Array.isArray(list)) continue;
      for(const row of list){ out.push({ race, row }); got++; }
    }
    if(got === 0 || out.length >= total) break;
  }
  return out;
}

/* "1:32:45.123" / "1:23.456" / "45.123" -> 秒 */
function timeToSec(s){
  if(!s || typeof s !== "string") return null;
  const p = s.trim().split(":").map(Number);
  if(!p.length || p.some(isNaN)) return null;
  if(p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if(p.length === 2) return p[0] * 60 + p[1];
  return p[0];
}

/* Ergast 的完赛状态 -> 本 App 的 dnf / dsq / dns 标记 */
function ergastStatus(row){
  const t = (row.positionText || "").toUpperCase();
  const st = (row.status || "").toLowerCase();
  if(t === "D" || st.includes("disqualif")) return { dsq: 1 };
  if(t === "E" || st.includes("excluded"))  return { dsq: 1 };
  if(t === "W" || st.includes("withdraw"))  return { dns: 1 };
  if(t === "F" || st.includes("failed to qualify")) return { dns: 1 };
  if(t === "R" || t === "N" || st === "accident" || st.includes("collision") ||
     st.includes("engine") || st.includes("gearbox") || st.includes("hydraulics") ||
     st.includes("electrical") || st.includes("spun off") || st.includes("retired") ||
     st.includes("damage") || st.includes("brakes") || st.includes("overheating") ||
     st.includes("mechanical") || st.includes("wheel") || st.includes("suspension") ||
     st.includes("fuel") || st.includes("tyre") || st.includes("oil") ||
     st.includes("water") || st.includes("puncture") || st.includes("illness") ||
     st.includes("injury") || st.includes("power unit") || st.includes("driveshaft") ||
     st.includes("clutch") || st.includes("vibration") || st.includes("ignition") ||
     st.includes("exhaust") || st.includes("throttle") || st.includes("steering") ||
     st.includes("technical") || st.includes("debris") || st.includes("seat") ||
     st.includes("rear wing") || st.includes("front wing")) return { dnf: 1 };
  return null;
}

/* =========================================================
   本地缓存
   ========================================================= */
/* 持久化缓存说明：
   · meetings(20KB) / sessions(47KB) —— 直接存
   · drivers —— API 原始返回 1.1MB（2771 条，同一车手在每个 session 重复一份），
     去重成「每分站每车手一条」后只有 ~300 条 / ~80KB，才适合写 localStorage。
     1.16MB 的同步写入在手机上会明显卡顿甚至超配额，这是之前“卡在 60%”的元凶。 */
let _store = { meetings: null, meetingsAt: 0, sessions: null, sessionsAt: 0, drivers: null, driversAt: 0 };
try{
  const raw = localStorage.getItem(LS_KEY);
  if(raw) _store = Object.assign(_store, JSON.parse(raw));
}catch(e){}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(_store)); }catch(e){}
}

/* ---------- 结果快照 ----------
   比 _store 更「成品」的一层：把组装好的成绩/积分榜存一份。
   两个数据源都连不上时用它顶上，至少不是一片白屏。
   注意体积：这是同步写 localStorage，之前 1.16MB 的写入把手机卡死过，
   所以只存渲染要用的字段，不含原始 API 响应，也不含车手信息（那个走 _store.drivers）。 */
const SNAP_TTL = 7 * 24 * 60 * 60 * 1000;

function saveSnapshot(){
  try{
    localStorage.setItem(LS_KEY + "_snap", JSON.stringify({
      at: Date.now(),
      races: S.races,
      results: S.results,
      quali: S.quali,
      sprint: S.sprint,
      ds: S.ds,
      cs: S.cs,
      standingsRound: S.standingsRound,
      standingsMeeting: S.standingsMeeting
    }));
  }catch(e){ /* 超配额就算了，不能影响主流程 */ }
}

function loadSnapshot(){
  try{
    const raw = localStorage.getItem(LS_KEY + "_snap");
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.races) || !s.races.length) return null;
    if(Date.now() - (s.at || 0) > SNAP_TTL) return null;
    return s;
  }catch(e){ return null; }
}

function applySnapshot(s){
  S.races = s.races || [];
  S.results = s.results || {};
  S.quali   = s.quali   || {};
  S.sprint  = s.sprint  || {};
  S.ds = s.ds || [];
  S.cs = s.cs || [];
  S.standingsRound   = (s.standingsRound === undefined)   ? null : s.standingsRound;
  S.standingsMeeting = (s.standingsMeeting === undefined) ? null : s.standingsMeeting;
  S.cachedAt = s.at;
  S.source = "cache";
  S.failed = [];
  /* 车手信息不在快照里（太大），从 _store.drivers 重建。
     那份缓存 3 天有效，赛季内车手名单不变，够用。 */
  const roster = {};
  for(const d of (_store.drivers || [])){
    if(roster[d.driver_number]) continue;
    roster[d.driver_number] = {
      number: d.driver_number,
      name: d.full_name,
      acronym: d.name_acronym,
      team: d.team_name,
      colour: "#" + (d.team_colour || "888888"),
      photo: photoOf(d.driver_number) || d.headshot_url || null,
      country: d.country_code
    };
  }
  S.drivers = {};
  for(const r of S.races){
    const bucket = {};
    for(const num of Object.keys(roster)) bucket[num] = roster[num];
    S.drivers[r.meeting_key] = bucket;   // 各分站共用同一对象，不复制
  }
  S.loaded = true;
}

/* =========================================================
   状态
   ========================================================= */
const S = {
  races: [],          // [{round, name, location, country, flag, date, circuit, sessions:{quali,sprint,race}}]
  results: {},        // round -> [row]
  quali: {},          // round -> [row]
  sprint: {},         // round -> [row]
  drivers: {},        // meeting_key -> { driver_number: {...} }
  ds: [],             // driver standings
  cs: [],             // constructor standings
  failed: [],
  loaded: false
};

/* =========================================================
   数据加载
   ========================================================= */
function sessionNameOf(s){ return s.session_name; }

/* 说明：所有请求都是「串行」的话，5 个请求 × 2.3 秒延迟 ≈ 11 秒。
   实测 openf1.org 单次响应约 2.3s，且响应体大小对耗时影响不大，
   所以提速的关键是「并行」而不是「减小体积」。
   这里分两阶段并行，并让赛程一拿到就先渲染出来。 */
async function loadAll(onProgress, onScheduleReady){
  const P = (d, t, label) => { if(onProgress) onProgress(d, t, label); };

  // ============ 阶段 1：赛程（meetings + sessions 并行）============
  P(1, 3, "获取赛程");
  const needM = !(_store.meetings && (Date.now() - _store.meetingsAt) < SCHEDULE_TTL);
  const needS = !(_store.sessions && (Date.now() - _store.sessionsAt) < SCHEDULE_TTL);

  const [meetings, sessions] = await Promise.all([
    needM ? of1(`/meetings?year=${YEAR}`) : Promise.resolve(_store.meetings),
    needS ? of1(`/sessions?year=${YEAR}`) : Promise.resolve(_store.sessions)
  ]);
  if(needM){ _store.meetings = meetings; _store.meetingsAt = Date.now(); }
  if(needS){ _store.sessions = sessions; _store.sessionsAt = Date.now(); }
  if(needM || needS) saveStore();

  // ---- 组装赛程：排除测试赛与已取消，按日期排序编号 ----
  const byMeeting = {};
  for(const s of sessions){
    (byMeeting[s.meeting_key] = byMeeting[s.meeting_key] || []).push(s);
  }
  const real = meetings
    .filter(m => !m.is_cancelled)
    .filter(m => (byMeeting[m.meeting_key] || []).some(s => s.session_name === "Race"))
    .sort((a, b) => new Date(a.date_start) - new Date(b.date_start));

  S.races = real.map((m, i) => {
    const list = byMeeting[m.meeting_key] || [];
    const find = nm => list.find(s => s.session_name === nm) || null;
    const q  = find("Qualifying");
    const sp = find("Sprint");
    const sq = find("Sprint Qualifying");
    const rc = find("Race");
    return {
      round: i + 1,
      meeting_key: m.meeting_key,
      name: m.meeting_name,
      official: m.meeting_official_name,
      location: m.location,
      country: m.country_name,
      flag: m.country_flag,
      weekendStart: (m.date_start || "").slice(0, 10),
      circuit: m.circuit_short_name,
      /* 正赛日（北京时区）。
         以前这里用的是 meeting.date_start —— 那是周末第一天（周五），
         不是正赛日，所以赛程上显示的日期一直是错的。 */
      date: bjDate(rc && rc.date_start) || (m.date_start || "").slice(0, 10),
      /* 各阶段真实开赛时间（UTC ISO）。显示时用 fmtSession 转北京时间。 */
      times: {
        sprintq: sq ? sq.date_start : null,
        sprint:  sp ? sp.date_start : null,
        quali:   q  ? q.date_start : null,
        race:    rc ? rc.date_start : null
      },
      raceStart: rc ? rc.date_start : m.date_start,
      raceEnd:   rc ? rc.date_end   : m.date_end,
      sessions: {
        quali:  q  ? q.session_key : null,
        sprint: sp ? sp.session_key : null,
        race:   rc ? rc.session_key : null
      }
    };
  });

  const now = Date.now();
  /* 「已完赛」以正赛结束时间为准。
     以前用分站开始日（周五）的 23:59 去比 —— 周六就认为周日的比赛已结束，
     会去拉还没产生的成绩，然后误报「上游数据源尚未同步」。 */
  const past = S.races.filter(r => r.raceEnd && new Date(r.raceEnd).getTime() < now);
  // 赛程已就绪 → 先让界面把它渲染出来，用户不用干等后面的数据
  if(onScheduleReady) onScheduleReady();

  // ============ 阶段 2：车手 / 成绩 / 积分榜（三者并行）============
  P(2, 3, "获取成绩与积分榜");

  const needD = !(_store.drivers && _store.driversAt && (Date.now() - _store.driversAt) < SCHEDULE_TTL);
  const minMk  = S.races.length ? Math.min(...S.races.map(r => r.meeting_key)) : null;

  // 需要哪些 session（已完赛的排位/冲刺/正赛）
  const pastKeys = [];
  for(const r of past){
    for(const k of ["quali","sprint","race"]){
      if(r.sessions[k]) pastKeys.push({ round: r.round, kind: k, key: r.sessions[k] });
    }
  }
  const minKey  = pastKeys.length ? Math.min(...pastKeys.map(x => x.key)) : null;
  const lastPast = past.length ? past[past.length - 1] : null;
  const champKey = lastPast && lastPast.sessions.race ? lastPast.sessions.race : null;

  const [fullDrivers, rows, champ] = await Promise.all([
    (needD && minMk !== null) ? of1(`/drivers?meeting_key>=${minMk}`) : Promise.resolve(null),
    (minKey !== null) ? of1(`/session_result?session_key>=${minKey}`) : Promise.resolve(null),
    champKey
      ? Promise.allSettled([
          of1(`/championship_drivers?session_key=${champKey}`),
          of1(`/championship_teams?session_key=${champKey}`)
        ])
      : Promise.resolve([{ status:"fulfilled", value:[] }, { status:"fulfilled", value:[] }])
  ]);

  P(3, 3, "整理数据");

  // ---- 车手信息（去重后才缓存，避免 1MB 级写入）----
  let driversRaw = _store.drivers;
  if(needD && fullDrivers){
    const pastMk = new Set(past.map(r => r.meeting_key));   // 只留已完赛分站
    const seen = new Set();
    driversRaw = [];
    for(const d of fullDrivers){
      if(!pastMk.has(d.meeting_key)) continue;
      const k = d.meeting_key + ":" + d.driver_number;
      if(seen.has(k)) continue;       // 同一分站同一车手只留一条
      seen.add(k);
      driversRaw.push(d);
    }
    _store.drivers = driversRaw;
    _store.driversAt = Date.now();
    saveStore();
  }
  S.drivers = {};
  for(const d of (driversRaw || [])){
    const bucket = S.drivers[d.meeting_key] = S.drivers[d.meeting_key] || {};
    if(!bucket[d.driver_number]){
      bucket[d.driver_number] = {
        number: d.driver_number,
        name: d.full_name,
        acronym: d.name_acronym,
        team: d.team_name,
        colour: "#" + (d.team_colour || "888888"),
        photo: photoOf(d.driver_number) || d.headshot_url || null,
        country: d.country_code
      };
    }
  }

  // ---- 成绩 ----
  S.results = {}; S.quali = {}; S.sprint = {};
  S.failed = [];
  if(rows){
    const byKey = {};
    for(const r of rows) (byKey[r.session_key] = byKey[r.session_key] || []).push(r);
    for(const pk of pastKeys){
      const list = (byKey[pk.key] || []).slice().sort((a, b) => {
        const pa = a.position ?? 999, pb = b.position ?? 999;
        return pa - pb;
      });
      if(!list.length) continue;
      if(pk.kind === "race")       S.results[pk.round] = list;
      else if(pk.kind === "quali") S.quali[pk.round]   = list;
      else                         S.sprint[pk.round]  = list;
    }
  }

  // ---- 积分榜 ----
  S.ds = []; S.cs = [];
  if(champ && champ[0] && champ[0].status === "fulfilled") S.ds = champ[0].value || [];
  if(champ && champ[1] && champ[1].status === "fulfilled") S.cs = champ[1].value || [];
  if(lastPast){
    S.standingsRound = lastPast.round;
    S.standingsMeeting = lastPast.meeting_key;
  }

  S.source = "openf1";
  S.cachedAt = null;
  saveSnapshot();
  S.loaded = true;
  return past.length;
}

/* Jolpica 给的国家名 -> 国旗图。只在没有 OpenF1 缓存时才用到。 */
const COUNTRY_CC = {

  "USA":"us","United States":"us","Italy":"it","Monaco":"mc","Spain":"es",
  "Canada":"ca","Austria":"at","UK":"gb","United Kingdom":"gb","Great Britain":"gb",
  "Hungary":"hu","Belgium":"be","Netherlands":"nl","Azerbaijan":"az","Singapore":"sg",
  "Mexico":"mx","Brazil":"br","Qatar":"qa","UAE":"ae","United Arab Emirates":"ae",
  "Malaysia":"my","Portugal":"pt","Turkey":"tr","France":"fr","Germany":"de",
  "Korea":"kr","South Korea":"kr","India":"in","South Africa":"za","Switzerland":"ch"
};
function flagUrl(country){
  const cc = COUNTRY_CC[country];
  return cc ? "https://flagcdn.com/w40/" + cc + ".png" : null;
}

/* 车手照片 / 车队色：优先用 OpenF1 之前缓存下来的（3 天内有效），
   这样切到备用源时头像和配色不会突然消失。 */
function cachedDriver(num){
  const list = _store.drivers;
  if(!Array.isArray(list)) return null;
  return list.find(x => x.driver_number === num) || null;
}
function bestPhoto(num){
  const cdn = photoOf(num);
  if(cdn) return cdn;
  const d = cachedDriver(num);
  return (d && d.headshot_url) || null;
}
function bestColour(num, fallback){
  const d = cachedDriver(num);
  if(d && d.team_colour) return "#" + d.team_colour;
  return fallback;
}

/* Jolpica 不给排位/冲刺的开赛时间。
   如果本地还留着 OpenF1 的 meetings/sessions 缓存（3 天），
   按「分站日期区间」匹配，把时间补回来。匹配不上就留空 ——
   sessionLines() 会自动跳过没有时间的阶段，不会显示 "—"。 */
function mergeSessionTimes(races){
  const ms = _store.meetings, ss = _store.sessions;
  if(!Array.isArray(ms) || !Array.isArray(ss)) return 0;
  const byMeeting = {};
  for(const s of ss) (byMeeting[s.meeting_key] = byMeeting[s.meeting_key] || []).push(s);
  let n = 0;
  for(const r of races){
    const rd = new Date(r.date + "T12:00:00Z").getTime();
    const m = ms.find(x => {
      if(x.is_cancelled) return false;
      const a = new Date(x.date_start).getTime() - 36 * 3600 * 1000;
      const b = new Date(x.date_end).getTime()   + 36 * 3600 * 1000;
      return rd >= a && rd <= b;
    });
    if(!m) continue;
    const list = byMeeting[m.meeting_key] || [];
    const find = nm => (list.find(s => s.session_name === nm) || {}).date_start || null;
    r.times.race    = r.times.race    || find("Race");
    r.times.quali   = r.times.quali   || find("Qualifying");
    r.times.sprint  = r.times.sprint  || find("Sprint");
    r.times.sprintq = r.times.sprintq || find("Sprint Qualifying");
    if(!r.flag && m.country_flag) r.flag = m.country_flag;
    n++;
  }
  return n;
}

async function loadFromJolpica(onProgress){
  const P = (d, t, label) => { if(onProgress) onProgress(d, t, label); };

  /* ---- 1. 赛程 ---- */
  P(1, 3, "备用源：获取赛程");
  const sch  = await jolGet(`/${YEAR}/races.json?limit=100`);
  const jRaces = (sch.MRData && sch.MRData.RaceTable && sch.MRData.RaceTable.Races) || [];
  if(!jRaces.length) throw new Error("Jolpica 没返回赛程");

  /* Ergast 的 races.json 里带了各阶段的日期和时间（Qualifying / Sprint），
     所以备用源也能显示排位和冲刺的开赛时间，不只是正赛。
     唯一缺的是「冲刺排位」（Ergast 没这个字段），由 mergeSessionTimes 从
     OpenF1 缓存补；补不到就不显示（sessionLines 会自动跳过该行）。

     date 必须按北京时区算：Jolpica 的 r.date 是当地日期，
     美洲站在北京时间会跨天，直接用它会和下面的开赛时间自相矛盾。 */
  const joinIso = (d, t) => (d ? (t ? `${d}T${t}` : `${d}T12:00:00Z`) : null);

  S.races = jRaces.map((r, i) => {
    const round = parseInt(r.round, 10) || (i + 1);
    const loc   = (r.Circuit && r.Circuit.Location) || {};
    const raceIso   = joinIso(r.date, r.time);
    const qualiIso  = r.Qualifying ? joinIso(r.Qualifying.date, r.Qualifying.time) : null;
    const sprintIso = r.Sprint     ? joinIso(r.Sprint.date,     r.Sprint.time)     : null;
    const start = new Date(raceIso);
    const end   = new Date(start.getTime() + 2 * 3600 * 1000);
    return {
      round,
      meeting_key: round,          // Jolpica 没有 meeting_key，用轮次代替
      name: r.raceName,
      official: r.raceName,
      location: loc.locality || "",
      country: loc.country || "",
      flag: flagUrl(loc.country),
      date: bjDate(raceIso) || r.date,
      circuit: (r.Circuit && r.Circuit.circuitName) || "",
      times: { sprintq: null, sprint: sprintIso, quali: qualiIso, race: raceIso },
      raceStart: raceIso,
      raceEnd: isNaN(end) ? null : end.toISOString(),
      /* sprint 只在该站真有冲刺赛时才有值。
         之前一律填轮次号，结果每一站都被标上「冲刺」徽章。 */
      sessions: { quali: round, sprint: r.Sprint ? round : null, race: round }
    };
  });

  mergeSessionTimes(S.races);
  if(onProgress) onProgress(1, 3, "备用源：获取赛程");

  /* ---- 2. 成绩（整季翻页拉）---- */
  P(2, 3, "备用源：获取成绩");
  const [raceRows, qualiRows, sprintRows] = await Promise.all([
    jolPaged(`/${YEAR}/results.json`,    "Results"),
    jolPaged(`/${YEAR}/qualifying.json`, "QualifyingResults"),
    jolPaged(`/${YEAR}/sprint.json`,     "SprintResults")
  ]);

  /* ---- 3. 积分榜 ---- */
  P(3, 3, "备用源：获取积分榜");
  const [dsJ, csJ] = await Promise.all([
    jolGet(`/${YEAR}/driverStandings.json`).catch(() => null),
    jolGet(`/${YEAR}/constructorStandings.json`).catch(() => null)
  ]);

  /* ---- 车手名单（从成绩里抽，一个赛季的名单是稳定的）---- */
  const roster = {};
  const absorb = (drv, con, numRaw) => {
    const num = parseInt(numRaw, 10);
    if(!num || roster[num]) return;
    const name = ((drv.givenName || "") + " " + (drv.familyName || "")).trim();
    roster[num] = {
      number: num,
      name,
      acronym: drv.code || (drv.familyName || "???").slice(0, 3).toUpperCase(),
      team: con ? con.name : "",
      colour: bestColour(num, con ? teamColour(con.constructorId) : "#888888"),
      photo: bestPhoto(num),
      country: drv.nationality || null
    };
  };
  for(const { row } of raceRows)  absorb(row.Driver || {}, row.Constructor, row.number);
  for(const { row } of sprintRows) absorb(row.Driver || {}, row.Constructor, row.number);
  for(const { row } of qualiRows) absorb(row.Driver || {}, row.Constructor, row.number);

  S.drivers = {};
  for(const r of S.races){
    const bucket = {};
    for(const num of Object.keys(roster)) bucket[num] = roster[num];
    S.drivers[r.round] = bucket;       // 所有分站共用同一个对象，不复制
  }

  /* ---- 结果归类 ---- */
  const orderPos = (a, b) => (a.position ?? 999) - (b.position ?? 999);

  S.results = {}; S.quali = {}; S.sprint = {}; S.failed = [];

  // 正赛 / 冲刺赛
  const buildRaceRow = (row, leaderMs) => {
    const out = {
      driver_number: parseInt(row.number, 10),
      position: parseInt(row.position, 10) || null,
      points: parseFloat(row.points) || 0,
      number_of_laps: parseInt(row.laps, 10) || null
    };
    Object.assign(out, ergastStatus(row) || {});
    const ms = row.Time && row.Time.millis ? parseInt(row.Time.millis, 10) : null;
    if(out.position === 1 && row.Time && row.Time.time){
      out.duration = timeToSec(row.Time.time);
    } else if(ms && leaderMs){
      out.gap_to_leader = (ms - leaderMs) / 1000;
    } else if(row.status && /^\+\d+\s*Laps?$/i.test(row.status)){
      out.gap_to_leader = row.status;      // 被套圈，交给 gapText 处理
    }
    return out;
  };

  {
    const byRound = {};
    for(const { race, row } of raceRows){
      const rd = parseInt(race.round, 10);
      (byRound[rd] = byRound[rd] || []).push(row);
    }
    for(const rd of Object.keys(byRound)){
      const list = byRound[rd].slice().sort(orderPos);
      const leader = list.find(x => parseInt(x.position, 10) === 1);
      const leaderMs = leader && leader.Time && leader.Time.millis ? parseInt(leader.Time.millis, 10) : null;
      S.results[rd] = list.map(row => buildRaceRow(row, leaderMs));
    }
  }
  {
    const byRound = {};
    for(const { race, row } of sprintRows){
      const rd = parseInt(race.round, 10);
      (byRound[rd] = byRound[rd] || []).push(row);
    }
    for(const rd of Object.keys(byRound)){
      const list = byRound[rd].slice().sort(orderPos);
      const leader = list.find(x => parseInt(x.position, 10) === 1);
      const leaderMs = leader && leader.Time && leader.Time.millis ? parseInt(leader.Time.millis, 10) : null;
      S.sprint[rd] = list.map(row => buildRaceRow(row, leaderMs));
    }
  }
  {
    // 排位赛：Ergast 给 Q1/Q2/Q3 三段，取最快的一段作为成绩
    const byRound = {};
    for(const { race, row } of qualiRows){
      const rd = parseInt(race.round, 10);
      (byRound[rd] = byRound[rd] || []).push(row);
    }
    for(const rd of Object.keys(byRound)){
      const list = byRound[rd].slice().sort(orderPos);
      S.quali[rd] = list.map(row => {
        const secs = [row.Q1, row.Q2, row.Q3].map(timeToSec).filter(x => x != null);
        const best = secs.length ? Math.min(...secs) : null;
        return {
          driver_number: parseInt(row.number, 10),
          position: parseInt(row.position, 10) || null,
          duration: best != null ? [best] : []   // 单元素数组，sessionTable 取 .pop() 正好拿到
        };
      });
    }
  }

  /* ---- 积分榜 ---- */
  const sl = j => {
    const t = j && j.MRData && j.MRData.StandingsTable;
    return (t && t.StandingsLists && t.StandingsLists[0]) || null;
  };
  const dsList = sl(dsJ), csList = sl(csJ);

  S.ds = ((dsList && dsList.DriverStandings) || []).map(x => {
    const num = parseInt(x.Driver && x.Driver.permanentNumber, 10) || 0;
    return {
      driver_number: num,
      position_current: parseInt(x.position, 10),
      points_current: parseFloat(x.points) || 0
    };
  }).filter(x => x.driver_number);

  S.cs = ((csList && csList.ConstructorStandings) || []).map(x => ({
    team_name: (x.Constructor && x.Constructor.name) || "",
    position_current: parseInt(x.position, 10),
    points_current: parseFloat(x.points) || 0
  }));

  /* 积分榜对应的分站：最后一站有正赛成绩的 */
  const doneRounds = Object.keys(S.results).map(Number).sort((a, b) => a - b);
  const lastDone = doneRounds.length ? doneRounds[doneRounds.length - 1] : null;
  S.standingsRound   = lastDone;
  S.standingsMeeting = lastDone;

  S.source = "jolpica";
  S.cachedAt = null;
  saveSnapshot();
  S.loaded = true;
  return doneRounds.length;
}

/* =========================================================
   行数据 → 显示用对象
   ========================================================= */
function statusText(row){
  if(row.dsq) return "取消资格";
  if(row.dns) return "未发车";
  if(row.dnf) return "退赛";
  return null;
}
function fmtDuration(sec){
  if(typeof sec !== "number" || !isFinite(sec)) return null;
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return m > 0 ? `${m}:${s.toFixed(3).padStart(6, "0")}` : s.toFixed(3);
}
/* 被套圈车手的 gap_to_leader 是字符串，例如 "+1 LAP" / "+2 LAPS" → 译成中文 */
function gapText(s){
  return String(s).replace(/\+\s*(\d+)\s*LAPS?/i, "+$1 圈");
}
/* 把 gap_to_leader 统一成可显示的文本；无法处理时返回 null */
function gapCellOf(row){
  const g = row.gap_to_leader;
  if(typeof g === "number" && isFinite(g)) return "+" + g.toFixed(3);
  if(typeof g === "string" && g.trim())    return gapText(g);
  return null;
}
function driverOf(meetingKey, num){
  return S.drivers?.[meetingKey]?.[num] || null;
}
function avatar(d, fallbackText){
  const txt = esc(d?.acronym || fallbackText || "?");
  const col = d?.colour || "#7a8296";
  if(d?.photo){
    const fb = "this.outerHTML='<span class=\\'av\\' style=\\'background:" + col + "\\'>" + txt + "</span>'";
    return '<img src="' + d.photo + '" alt="' + txt + '" loading="lazy" onerror="' + fb + '">';
  }
  return '<span class="av" style="background:' + col + '">' + txt + '</span>';
}
function driverCell(meetingKey, num){
  const d = driverOf(meetingKey, num);
  if(!d) return '<span class="muted">#' + esc(num) + '</span>';
  const cn = driverCN(d.name);
  const title = cn
    ? esc(cn) + ' <span class="cd">' + esc(d.name) + '</span>'
    : esc(d.name);
  return '<div class="dr">' + avatar(d) +
         '<div><div class="nm">' + title + '</div>' +
         '<div class="cd">' + esc(d.acronym) + ' · #' + esc(d.number) + '</div></div></div>';
}
function teamCell(meetingKey, num){
  const d = driverOf(meetingKey, num);
  if(!d) return '<span class="muted">—</span>';
  return '<div class="team" style="border-color:' + d.colour + '">' + esc(teamCN(d.team)) + '</div>';
}

/* =========================================================
   渲染：赛程
   ========================================================= */
const WEEK_CN = ["周日","周一","周二","周三","周四","周五","周六"];

/* OpenF1 给的时间全是 UTC（形如 2026-03-29T05:00:00+00:00）。
   中国用户要看北京时间 = 固定 UTC+8（中国不用夏令时）。
   注意不能直接截字符串取日期：美洲那些凌晨 UTC 的比赛，
   按 UTC 截出来的日期和北京时间差一天。所以走 Date 换算。 */
const BJ_OFFSET = 8 * 3600 * 1000;
function bjParts(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const t = new Date(d.getTime() + BJ_OFFSET);   // 加 8 小时后按 UTC 字段读
  return {
    y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(),
    hh: String(t.getUTCHours()).padStart(2, "0"),
    mm: String(t.getUTCMinutes()).padStart(2, "0"),
    dow: t.getUTCDay()
  };
}
/* ISO(UTC) -> "YYYY-MM-DD"（北京时区），给 fmtDate 用 */
function bjDate(iso){
  const p = bjParts(iso);
  return p ? `${p.y}-${String(p.m).padStart(2, "0")}-${String(p.d).padStart(2, "0")}` : null;
}
/* ISO(UTC) -> "3月29日 周日 13:00"（北京时区） */
function fmtSession(iso){
  const p = bjParts(iso);
  return p ? `${p.m}月${p.d}日 ${WEEK_CN[p.dow]} ${p.hh}:${p.mm}` : "—";
}
/* "YYYY-MM-DD" -> "3月29日 周日" */
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d + "T12:00:00");
  if(isNaN(dt)) return d;
  return `${dt.getMonth() + 1}月${dt.getDate()}日 ${WEEK_CN[dt.getDay()]}`;
}
function nextRound(){
  const now = Date.now();
  for(const r of S.races){
    if(r.raceEnd && new Date(r.raceEnd).getTime() > now) return r.round;
  }
  return null;
}

/* 赛程行里列出各阶段的北京时间。
   冲刺周末的顺序是：冲刺排位(五) → 冲刺赛(六) → 排位赛(六) → 正赛(日)。 */
function sessionLines(r){
  const t = r.times || {};
  const rows = [];
  if(t.sprintq) rows.push(["冲刺排位", t.sprintq]);
  if(t.sprint)  rows.push(["冲刺赛",   t.sprint]);
  if(t.quali)   rows.push(["排位赛",   t.quali]);
  if(t.race)    rows.push(["正赛",     t.race]);
  if(!rows.length) return "";
  return '<div class="rsess">' + rows.map(([k, v]) =>
    '<span><i>' + esc(k) + '</i>' + esc(fmtSession(v)) + '</span>').join("") + '</div>';
}
function flagImg(race){
  if(!race?.flag) return "";
  return '<img class="flag" src="' + esc(race.flag) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
}

function renderSeason(){
  const nr = nextRound();
  const done = S.races.filter(r => S.results[r.round]).length;
  $("#prog").textContent = `已完赛 ${done} / ${S.races.length} 站`;

  $("#raceList").innerHTML = S.races.map(r => {
    const isNext = r.round === nr;
    const hasRes = !!S.results[r.round];
    return `<div class="race ${isNext ? "next" : ""}" data-round="${r.round}">
      <div class="rd"><small>R</small>${esc(r.round)}</div>
      <div>
        <div class="rname">${flagImg(r)} ${esc(raceCN(r))}
          <span class="en">${esc(r.name)}</span>
          ${r.sessions.sprint ? '<span class="badge">冲刺</span>' : ""}
          ${isNext ? '<span class="badge" style="background:#3d9dff;color:#fff">下一站</span>' : ""}</div>
        <div class="rmeta">${esc(r.circuit || "")} · ${esc(r.location || "")}</div>
        ${sessionLines(r)}
      </div>
      <div class="rdate"><b>${esc(fmtDate(r.date))}</b>正赛日 · ${hasRes ? "已完赛" : "未开赛"}</div>
    </div>`;
  }).join("");

  $("#raceList").querySelectorAll(".race").forEach(el => {
    el.onclick = () => { switchTab("results"); showRound(Number(el.dataset.round)); };
  });

  // 数据源状态 + 未同步提示
  const note = $("#dataNote");
  if(note){
    let html = "";

    if(S.source === "jolpica"){
      html += `<div class="card"><div class="msg" style="color:var(--blue)">
        ℹ️ 主数据源 <b>OpenF1</b> 当前不可用 —— 它在 F1 比赛进行期间会锁掉整个接口。
        已自动切到备用源 <b>Jolpica</b>，赛程 / 成绩 / 积分榜正常；车手照片和车队配色
        取自上赛季缓存，可能有个别缺失。</div></div>`;
    } else if(S.source === "cache"){
      const t = S.cachedAt
        ? new Date(S.cachedAt).toLocaleString("zh-CN", { hour12: false })
        : "未知时间";
      html += `<div class="card"><div class="msg" style="color:var(--gold)">
        ⚠️ <b>当前显示的是本地缓存</b>（存于 ${esc(t)}），两个数据源都连不上。
        数据不一定是最新的，网络恢复后点右上角「刷新数据」。</div></div>`;
    }

    const missing = S.races.filter(r =>
      r.raceEnd && new Date(r.raceEnd).getTime() < Date.now() && !S.results[r.round]);
    if(missing.length){
      const list = missing.map(r => `第${esc(r.round)}站 ${esc(raceCN(r))}`).join("、");
      html += `<div class="card"><div class="msg" style="color:var(--gold)">
        ⏳ ${list} 的成绩 <b>上游数据源尚未同步</b>（通常在赛后几分钟到几小时内补齐）。</div></div>`;
    }

    if(html){ note.innerHTML = html; note.classList.remove("hide"); }
    else note.classList.add("hide");
  }
}

   渲染：积分榜
   ========================================================= */

      </tr>`;
    }).join("");
  } else {
    $("#dsBody").innerHTML = '<tr><td colspan="5" class="msg">暂无数据</td></tr>';
  }

  if(S.cs.length){
    const rows = S.cs.slice().sort((a, b) => a.position_current - b.position_current);

    $("#csBody").innerHTML = rows.map(r => {
      const d = Object.values(S.drivers?.[mk] || {}).find(x => x.team === r.team_name);

      const gap = r.points_current - top;
      const w = top > 0 ? Math.max(2, r.points_current / top * 100) : 0;
      const p = r.position_current;
      const cls = p === 1 ? "p1" : p === 2 ? "p2" : p === 3 ? "p3" : "";
      return `<tr>
        <td class="pos ${cls}">${esc(p)}</td>
        <td><div class="team" style="border-color:${col};font-size:13.5px;font-weight:600;color:var(--txt)">${esc(teamCN(r.team_name))} <span class="cd">${esc(r.team_name)}</span></div></td>
        <td class="pts">${esc(r.points_current)}</td>
        <td class="hide-m"><span class="num">${gap === 0 ? "—" : "-" + gap}</span>
            <div class="bar"><i style="width:${w}%;background:${col}"></i></div></td>
      </tr>`;
    }).join("");
  } else {
    $("#csBody").innerHTML = '<tr><td colspan="4" class="msg">暂无数据</td></tr>';
  }
}

/* =========================================================
   渲染：成绩表
   ========================================================= */
function sessionTable(rows, kind, meetingKey){
  if(!rows || !rows.length) return '<div class="card"><div class="msg">本站无此阶段数据。</div></div>';
  const isRace = kind === "race" || kind === "sprint";

  const head = `<tr>
    <th style="width:52px">名次</th>
    <th>车手</th>
    <th class="hide-m">车队</th>
    ${isRace ? '<th class="hide-m" style="width:60px">圈数</th>' : ""}
    <th>${isRace ? "成绩 / 状态" : "最快圈"}</th>
    ${isRace ? '<th style="text-align:right;width:70px">积分</th>' : ""}
  </tr>`;

  let shown = 0;
  const body = rows.map(r => {
    const d = driverOf(meetingKey, r.driver_number) || {};
    const col = d.colour || "#7a8296";
    const st = statusText(r);
    const pos = r.position ?? (st ? "—" : ++shown);
    const cls = pos === 1 ? "p1" : pos === 2 ? "p2" : pos === 3 ? "p3" : (st ? "pd" : "");

    let cell;
    if(isRace){
      const total = fmtDuration(r.duration);
      if(st){
        cell = '<span class="muted">' + esc(st) + '</span>';
      } else if(r.position === 1 && total){
        cell = '<span class="num">' + esc(total) + '</span>';
      } else {
        const gap = gapCellOf(r);
        if(gap)          cell = '<span class="num">' + esc(gap) + '</span>';
        else if(total)   cell = '<span class="num">' + esc(total) + '</span>';
        else             cell = '<span class="muted">—</span>';
      }
    } else {
      const arr = Array.isArray(r.duration) ? r.duration : [];
      const best = arr.filter(x => typeof x === "number").pop();
      cell = best != null ? '<span class="num">' + esc(fmtDuration(best)) + '</span>' : '<span class="muted">—</span>';
    }

    return `<tr>
      <td class="pos ${cls}">${esc(pos)}</td>
      <td>${driverCell(meetingKey, r.driver_number)}</td>
      <td class="hide-m">${teamCell(meetingKey, r.driver_number)}</td>
      ${isRace ? `<td class="num hide-m">${esc(dash(r.number_of_laps))}</td>` : ""}
      <td>${cell}</td>
      ${isRace ? `<td class="pts">${r.points > 0 ? esc(r.points) : '<span class="muted">0</span>'}</td>` : ""}
    </tr>`;
  }).join("");

  return `<div class="card"><div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
}

/* =========================================================
   渲染：单站详情
   ========================================================= */
function renderResultsList(){
  const withRes = S.races.filter(r => S.results[r.round]);
  if(!withRes.length){
    $("#resultsList").innerHTML = '<div class="card"><div class="msg">本赛季暂无已完成的比赛。</div></div>';
    return;
  }
  $("#resultsList").innerHTML = `<div class="card">
    <div class="card-h">选择比赛 <span class="pill">${withRes.length} 站可查看</span></div>
    ${withRes.map(r => `<div class="race" data-round="${r.round}">
        <div class="rd"><small>R</small>${esc(r.round)}</div>
        <div>
          <div class="rname">${flagImg(r)} ${esc(raceCN(r))}
            <span class="en">${esc(r.name)}</span>${r.sessions.sprint ? '<span class="badge">冲刺</span>' : ""}</div>
          <div class="rmeta">${esc(r.circuit || "")} · ${esc(fmtDate(r.date))}</div>
        </div>
        <div class="rdate">查看成绩 ›</div>
      </div>`).join("")}
  </div>`;
  $("#resultsList").querySelectorAll(".race").forEach(el => {
    el.onclick = () => showRound(Number(el.dataset.round));
  });
}

function showRound(round){
  const r = S.races.find(x => x.round === round);
  if(!r) return;
  const mk = r.meeting_key;

  $("#resultsList").classList.add("hide");
  const d = $("#roundDetail");
  d.classList.remove("hide");

  d.innerHTML = `
    <button class="back" id="backBtn">‹ 返回比赛列表</button>
    <div class="card" style="margin-bottom:20px">
      <div class="card-h" style="font-size:16px">
        ${flagImg(r)} 第 ${esc(r.round)} 站 · ${esc(raceCN(r))}
        <span class="muted">${esc(r.name)} · ${esc(r.circuit || "")}</span>
      </div>
      <div style="padding:10px 18px 12px">${sessionLines(r)}</div>
    </div>
    <div class="sess">
      <div class="sess-h"><span class="ln"></span>排位赛 Qualifying
        <span class="muted">${esc(fmtSession(r.times.quali))}</span></div>
      ${sessionTable(S.quali[round], "quali", mk)}
    </div>
    ${S.sprint[round] ? `<div class="sess">
      <div class="sess-h"><span class="ln" style="background:var(--gold)"></span>冲刺赛 Sprint
        <span class="muted">${esc(fmtSession(r.times.sprint))}</span></div>
      ${sessionTable(S.sprint[round], "sprint", mk)}
    </div>` : ""}
    <div class="sess">
      <div class="sess-h"><span class="ln" style="background:var(--green)"></span>正赛 Grand Prix
        <span class="muted">${esc(fmtSession(r.times.race))}</span></div>
      ${sessionTable(S.results[round], "race", mk)}
    </div>`;

  $("#backBtn").onclick = () => {
    d.classList.add("hide");
    $("#resultsList").classList.remove("hide");
  };
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================================================
   Tabs + 启动
   ========================================================= */
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  ["season","standings","results"].forEach(k => $("#tab-" + k).classList.toggle("hide", k !== name));
}
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => switchTab(t.dataset.tab); });

async function boot(force){
  if(force){ _cache.clear(); S.loaded = false; S.source = null; }
  const bar = txt => {
    $("#raceList").innerHTML = `<div class="msg">${esc(txt)}</div>`;
    $("#resultsList").innerHTML = `<div class="msg">${esc(txt)}</div>`;
  };
  const progress = (d, total, label) => {
    $("#prog").textContent = `加载中 ${Math.round(d / total * 100)}%`;
    bar(`正在${label || "获取数据"}…`);
  };
  // 赛程一拿到就先渲染出来，用户不用干等后面的数据
  const onScheduleReady = () => { renderSeason(); renderResultsList(); };

  try{
    if(!S.loaded){
      bar("正在获取赛程…");
      try{
        await loadAll(progress, onScheduleReady);
      }catch(e1){
        /* OpenF1 挂了。最常见的不是网络问题，而是比赛进行期间它把整个 API
           锁掉（401 "Live F1 session in progress"）—— 而那正好是用户最想
           查成绩的时候。所以不能直接报错，要换备用源。 */
        console.warn("[F1助手] OpenF1 失败，切换备用源：", e1.message);
        bar("主数据源不可用，正在切换备用源…");
        try{
          await loadFromJolpica(progress);
        }catch(e2){
          console.warn("[F1助手] Jolpica 也失败，退回本地缓存：", e2.message);
          const snap = loadSnapshot();
          if(!snap) throw e1;                 // 三个都没有，才真的没辙
          applySnapshot(snap);
          bar("两个数据源都连不上，正在显示本地缓存…");
        }
      }
    }
    bar("正在整理数据…");
    renderSeason();
    renderResultsList();
    renderStandings();
    const ts = $("#stamp");
    if(ts) ts.textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  }catch(e){
    const m = `<div class="msg err">数据加载失败：${esc(e.message)}<br><br>
      OpenF1 在 F1 比赛进行期间会锁站（属正常现象），此时备用源也会被尝试；
      若已过比赛时段，请等 1 分钟后点「刷新数据」重试。</div>`;
    $("#raceList").innerHTML = m;
    $("#resultsList").innerHTML = m;
    console.error(e);
  }
}

$("#refresh").onclick = async () => {
  const b = $("#refresh");
  b.disabled = true; b.textContent = "刷新中…";
  await boot(true);
  b.disabled = false; b.textContent = "刷新数据";
};

boot(false);

</script>
</body>
</html>
