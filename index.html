<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="preconnect" href="https://api.openf1.org" crossorigin>
<link rel="dns-prefetch" href="https://api.openf1.org">
<link rel="preconnect" href="https://api.jolpi.ca" crossorigin>
<link rel="dns-prefetch" href="https://api.jolpi.ca">
<link rel="preconnect" href="https://media.formula1.com">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 赛事助手</title>
<style>
:root{
  --bg:#0d0e12; --card:#16181f; --card2:#1c1f28; --line:#272b36;
  --txt:#e8eaf0; --dim:#8b93a7; --dim2:#5f6678;
  --red:#e10600; --gold:#ffd15c; --green:#00d17a; --blue:#3d9dff;
  --av:54px;          /* 车手头像尺寸；手机端在下面的媒体查询里调小 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5; padding:0 0 60px;
}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{
  background:linear-gradient(135deg,#15171e 0%,#1a0f10 100%);
  border-bottom:2px solid var(--red); padding:22px 0 0; margin-bottom:26px;
  position:sticky; top:0; z-index:50;
}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--red)}
.sub{color:var(--dim);font-size:12px;padding-bottom:4px}
.spacer{flex:1}
.btn{
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
  padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;
  font-family:inherit;transition:.15s;
}
.btn:hover{background:#252936;border-color:#39404f}
.btn:disabled{opacity:.5;cursor:default}
.stamp{color:var(--dim2);font-size:11.5px;margin-right:10px;white-space:nowrap}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin-top:18px}
.tab{
  background:none;border:none;color:var(--dim);padding:11px 20px;
  cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;
  border-bottom:3px solid transparent;transition:.15s;border-radius:6px 6px 0 0;
}
.tab:hover{color:var(--txt);background:#ffffff08}
.tab.on{color:#fff;border-bottom-color:var(--red);background:#ffffff0a}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
.muted{color:var(--dim);font-size:12.5px;font-weight:400}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11.5px;color:var(--dim);font-weight:600}
.msg{padding:16px 18px;color:var(--dim);font-size:13.5px}
.msg.err{color:#ff8a80}

/* ---------- race list ---------- */
.race{
  display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;
  padding:13px 18px;border-bottom:1px solid #ffffff0a;cursor:pointer;transition:.12s;
}
.race:last-child{border-bottom:none}
.race:hover{background:#ffffff07}
.race.next{background:linear-gradient(90deg,#e1060018,transparent)}
.rd{
  width:44px;height:44px;border-radius:10px;background:var(--card2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;border:1px solid var(--line);flex:none;
}
.rd small{font-size:9px;color:var(--dim2);font-weight:600;letter-spacing:.5px}
.race.next .rd{background:var(--red);border-color:var(--red)}
.race.next .rd small{color:#ffffffaa}
.rname{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rname .en{color:var(--dim2);font-size:11.5px;font-weight:500}
.rmeta{color:var(--dim);font-size:12px;margin-top:2px}
.rflag{font-size:20px;line-height:1}
.rdate{text-align:right;color:var(--dim);font-size:12.5px;white-space:nowrap}
.rdate b{display:block;color:var(--txt);font-size:13.5px;font-weight:600}
.badge{display:inline-block;background:var(--gold);color:#000;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:800;margin-left:6px}
/* 赛程行里的分阶段时间（排位 / 冲刺 / 正赛）。时间统一显示为北京时间 */
.rsess{margin-top:5px;display:flex;flex-direction:column;gap:1px}
.rsess span{display:flex;gap:8px;font-size:11.5px;color:var(--dim);line-height:1.5}
.rsess i{font-style:normal;color:var(--dim2);font-weight:600;min-width:46px;flex:none}
.sess-h .muted{font-weight:400;font-size:12px;margin-left:auto}

/* ---------- results table ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:10px 12px;color:var(--dim);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);
  background:var(--card2);white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid #ffffff08;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.1s}
tbody tr:hover{background:#ffffff07}
/* ---------- 焦点区：本周比赛 + 下一站 ---------- */
.focus{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;transition:.15s}
.fcard[data-jump]{cursor:pointer}
.fcard[data-jump]:hover{border-color:#3d9dff66;background:var(--card2)}
.fcard.now{border-color:#e1060066;background:linear-gradient(180deg,#e106000f,transparent)}
.ftag{font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--dim2);margin-bottom:7px}
.fcard.now .ftag{color:var(--red)}
.fname{font-size:16.5px;font-weight:800;color:var(--txt);display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.3}
.fmeta{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.fsess{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.fsess span{font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.fsess span i{font-style:normal;opacity:.65;margin-right:5px}
.fsess span b{font-weight:700}
.fsess span.done{opacity:.4}
.fsess span.live{background:#e1060020;border-color:#e1060077;color:#ff7b74;font-weight:700}
.fsess span.live b{color:#ff7b74}
/* ---------- 顶栏赛季切换器 ---------- */
.yearsw{display:flex;align-items:center;gap:1px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:2px;margin-right:2px}
.yearsw button{width:26px;height:26px;border:0;background:transparent;color:var(--dim);font-size:17px;font-weight:800;cursor:pointer;border-radius:7px;line-height:1;padding:0}
.yearsw button:hover:not(:disabled){background:#ffffff14;color:var(--txt)}
.yearsw button:disabled{opacity:.22;cursor:default}
.yearsw b{font-size:13.5px;font-weight:800;color:var(--txt);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.msg.future{color:var(--dim)}
.msg.live{color:#ff7b74;font-weight:700}
.msg.pending{color:var(--gold)}
.msg.none{color:var(--dim2)}
@media(max-width:560px){ .yearsw b{min-width:34px;font-size:12.5px} .yearsw button{width:23px;height:23px} }


.pos{
  font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;
  width:44px;text-align:center;
}
.pos.p1{color:var(--gold)} .pos.p2{color:#cfd4e0} .pos.p3{color:#d08a52}
.pos.pd{color:var(--dim2);font-size:13px}
.dr{display:flex;align-items:center;gap:11px;min-width:210px}
.dr img{width:var(--av);height:var(--av);border-radius:50%;object-fit:cover;object-position:top center;background:#22252e;flex:none}
.av{
  width:var(--av);height:var(--av);border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:15px;font-weight:800;
  color:#0d0e12;letter-spacing:.3px;
}
.dr .nm{font-weight:600;white-space:nowrap}
.dr .cd{color:var(--dim2);font-size:11px;font-weight:700;letter-spacing:.5px}
.team{
  padding-left:9px;border-left:3px solid #444;white-space:nowrap;
  color:var(--dim);font-size:12.5px;
}
.pts{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.num{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.fl{color:#c77dff;font-weight:700;font-size:11px}

/* ---------- standings ---------- */
.bar{height:5px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:5px;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px}

/* ---------- round detail ---------- */
.back{
  background:none;border:none;color:var(--blue);cursor:pointer;font-size:13.5px;
  font-family:inherit;padding:0 0 14px;font-weight:600;
}
.back:hover{text-decoration:underline}
.sess{margin-bottom:20px}
.sess-h{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:var(--card2);border-radius:10px 10px 0 0;font-weight:700;font-size:14px;
  border:1px solid var(--line);border-bottom:none;
}
.sess-h .ln{width:4px;height:16px;border-radius:2px;background:var(--red)}
.sess .card{border-radius:0 0 12px 12px;margin-bottom:0}

footer{text-align:center;color:var(--dim2);font-size:11.5px;margin-top:30px;line-height:1.9}
.hide{display:none!important}

/* 国旗图片（安卓不显示国旗 emoji，统一用图） */
.flag{width:22px;height:15px;border-radius:2px;object-fit:cover;
      vertical-align:-2px;background:#2a2e39;flex:none}

/* ================= 手机适配 ================= */
@media (max-width: 820px){
  body{font-size:13.5px;-webkit-text-size-adjust:100%}
  .wrap{padding:0 12px}

  header{padding:14px 0 0}
  .logo{font-size:19px}
  .sub{display:none}
  .stamp{display:none}
  .btn{padding:7px 11px;font-size:12px}
  .tabs{margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{padding:10px 14px;font-size:13px;white-space:nowrap}

  .card{border-radius:10px;margin-bottom:13px}
  .card-h{padding:11px 13px;font-size:13.5px;flex-wrap:wrap;gap:6px}

  /* 赛程行：日期挪到下一行，避免挤 */
  .race{grid-template-columns:40px 1fr;gap:10px;padding:11px 13px}
  .rd{width:36px;height:36px;font-size:13px;border-radius:8px}
  .rname{font-size:13.5px}
  .rname .en{display:none}
  .rmeta{font-size:11.5px}
  .rsess span{font-size:11px}
  .rsess i{min-width:42px}
  .rdate{grid-column:2;text-align:left;margin-top:3px;font-size:11.5px}
  .rdate b{display:inline;margin-right:6px}

  /* 表格：精准瘦身，不横向溢出 */
  th{padding:7px 6px;font-size:10px;letter-spacing:.2px}
  td{padding:6px 6px;font-size:12.5px}
  .pos{width:30px;font-size:13px}
  .dr{min-width:0;gap:8px}
  :root{--av:44px}                    /* 手机端头像跟着调小，但仍比原来大 */
  .av{font-size:12px}
  .dr .nm{font-size:12.5px;white-space:normal;line-height:1.25}
  .dr .cd{font-size:10px}
  .team{font-size:11px;padding-left:6px;border-left-width:2px;white-space:normal}
  .pts{font-size:12.5px}

  /* 隐藏次要列，保证不溢出 */
  th.hide-m, td.hide-m{display:none}

  .sess-h{padding:10px 13px;font-size:13px}
  .back{font-size:13px}
  footer{font-size:10.5px;padding:0 10px}
}

@media (max-width: 420px){
  .dr .nm .cd{display:none}          /* 极窄屏隐藏英文名 */
  th{padding:6px 4px}
  td{padding:6px 4px}
}
</style>

<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">F1 <span>赛事助手</span></div>
      <div class="sub" id="subTitle">赛程 / 排位 / 冲刺 / 正赛 / 积分榜</div>
      <div class="spacer"></div>
      <div class="yearsw">
        <button id="yPrev" title="上一年" aria-label="上一年">‹</button>
        <b id="yLabel">2026</b>
        <button id="yNext" title="下一年" aria-label="下一年">›</button>
      </div>
      <span class="stamp" id="stamp"></span>
      <button class="btn" id="refresh">刷新数据</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="season">赛程</button>
      <button class="tab" data-tab="standings">积分榜</button>
      <button class="tab" data-tab="results">比赛成绩</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ========== 赛程 ========== -->
  <section id="tab-season">
    <div id="dataNote" class="hide"></div>
    <div class="card">
      <div class="card-h"><span id="seasonTitle">赛季赛程</span> <span class="pill" id="prog">加载中…</span></div>
      <div id="raceList"><div class="msg">正在获取赛程…</div></div>
    </div>
  </section>

  <!-- ========== 积分榜 ========== -->
  <section id="tab-standings" class="hide">
    <div class="card">
      <div class="card-h">车手积分榜 <span class="pill" id="dsRound"></span></div>
      <div class="tw"><table>
        <thead><tr><th style="width:52px">名次</th><th>车手</th><th class="hide-m">车队</th><th style="text-align:right">积分</th><th class="hide-m" style="width:110px">差距</th></tr></thead>
        <tbody id="dsBody"><tr><td colspan="5" class="msg">加载中…</td></tr></tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-h">车队积分榜 <span class="pill" id="csRound"></span></div>
      <div class="tw"><table>
        <thead><tr><th style="width:52px">名次</th><th>车队</th><th style="text-align:right">积分</th><th class="hide-m" style="width:110px">差距</th></tr></thead>
        <tbody id="csBody"><tr><td colspan="4" class="msg">加载中…</td></tr></tbody>
      </table></div>
    </div>
  </section>

  <!-- ========== 比赛成绩 ========== -->
  <section id="tab-results" class="hide">
    <div id="resultsList"><div class="msg">正在获取赛程…</div></div>
    <div id="roundDetail" class="hide"></div>
  </section>

</div>

<footer>
  数据来源：<a href="https://openf1.org/" target="_blank">OpenF1 API</a>（社区项目，非官方）<br>

  本工具仅供个人学习与观赛参考，非官方产品，与 Formula 1、FIA、FOM 无关联
</footer>

<script>
"use strict";

/* =========================================================
   配置
   ========================================================= */
const OF1  = "https://api.openf1.org/v1";
/* =========================================================
   赛季（多年份支持）
   ---------------------------------------------------------
   原来这里写死 2026 —— 到了 2027 年这个工具就废了。
   现在：默认跟着系统年份走；12 月 15 日之后自动切到下一年
   （那时新赛季赛程一般已经公布）。也可以在顶栏手动切，
   选择会记在 localStorage，下次打开还是那一年。
   ========================================================= */
const SEASON_MIN = 2023;            // OpenF1 最早有数据的一年
const YEAR_KEY   = "f1app_year";

function seasonNow(){
  const d = new Date();
  const y = d.getFullYear();
  return (d.getMonth() === 11 && d.getDate() >= 15) ? y + 1 : y;
}
function seasonMax(){ return seasonNow() + 1; }     // 允许提前看下一年

let YEAR = (function(){
  try{
    const saved = Number(localStorage.getItem(YEAR_KEY));
    if(saved >= SEASON_MIN && saved <= seasonMax()) return saved;
  }catch(e){}
  return seasonNow();
})();
/* 缓存键。2026-10-03 换到 f1app3：
   旧版缓存的 drivers 里只存了"已完赛分站"的车手，于是刚跑完排位、正赛还没跑的
   这一站查不到车手 —— 成绩表里只剩 #18 #43 这样的车号，没有名字/头像/车队。
   光改取数逻辑不够：旧缓存还在 localStorage 里躺着，TTL 是 3 天，不换键就一直不刷新。 */
/* 缓存键带年份 —— 不同赛季各存各的，来回切不会串数据。
   写成函数是因为 YEAR 现在是可以变的。 */
const LSK = function(){ return "f1app3_" + YEAR; };
const CACHE_TTL = 5 * 60 * 1000;        // 内存缓存 5 分钟
const RESULT_TTL = 10 * 60 * 1000;      // 成绩表本地缓存 10 分钟（10 分钟内重开不用再请求）
const SCHEDULE_TTL = 3 * 24 * 60 * 60 * 1000;   // 赛程缓存 3 天

/* =========================================================
   分站中文名
   ========================================================= */
const RACE_CN = {
  "Australian Grand Prix":"澳大利亚大奖赛",
  "Chinese Grand Prix":"中国大奖赛",
  "Japanese Grand Prix":"日本大奖赛",
  "Bahrain Grand Prix":"巴林大奖赛",
  "Saudi Arabian Grand Prix":"沙特阿拉伯大奖赛",
  "Miami Grand Prix":"迈阿密大奖赛",
  "Canadian Grand Prix":"加拿大大奖赛",
  "Monaco Grand Prix":"摩纳哥大奖赛",
  "Barcelona Grand Prix":"巴塞罗那大奖赛",
  "Spanish Grand Prix":"西班牙大奖赛",
  "Austrian Grand Prix":"奥地利大奖赛",
  "British Grand Prix":"英国大奖赛",
  "Belgian Grand Prix":"比利时大奖赛",
  "Hungarian Grand Prix":"匈牙利大奖赛",
  "Dutch Grand Prix":"荷兰大奖赛",
  "Italian Grand Prix":"意大利大奖赛",
  "Azerbaijan Grand Prix":"阿塞拜疆大奖赛",
  "Singapore Grand Prix":"新加坡大奖赛",
  "United States Grand Prix":"美国大奖赛",
  "Mexico City Grand Prix":"墨西哥城大奖赛",
  "São Paulo Grand Prix":"圣保罗大奖赛",
  "Las Vegas Grand Prix":"拉斯维加斯大奖赛",
  "Qatar Grand Prix":"卡塔尔大奖赛",
  "Abu Dhabi Grand Prix":"阿布扎比大奖赛"
};
/* 2026 特例：API 把在吉隆坡办的这一站命名为 "Bahrain Grand Prix"（上游数据错误），
   按实际举办地 Kuala Lumpur 显示为马来西亚大奖赛 */
const LOCATION_CN_FIX = { "Kuala Lumpur":"马来西亚大奖赛" };

function raceCN(race){
  if(!race) return "";
  if(race.location && LOCATION_CN_FIX[race.location]) return LOCATION_CN_FIX[race.location];
  return RACE_CN[race.name] || race.name || "";
}

/* 车手中文名（按姓氏匹配，因为 OpenF1 只给英文全名） */
const CN_LAST = {
  "ANTONELLI":"安东内利", "RUSSELL":"拉塞尔", "HAMILTON":"汉密尔顿", "NORRIS":"诺里斯",
  "LECLERC":"勒克莱尔", "VERSTAPPEN":"维斯塔潘", "PIASTRI":"皮亚斯特里", "HADJAR":"哈贾尔",
  "LAWSON":"劳森", "GASLY":"加斯利", "LINDBLAD":"林德布拉德", "COLAPINTO":"科拉平托",
  "BEARMAN":"比尔曼", "BORTOLETO":"博尔托莱托", "HULKENBERG":"霍肯伯格", "SAINZ":"塞恩斯",
  "ALBON":"阿尔本", "OCON":"奥康", "ALONSO":"阿隆索", "TSUNODA":"角田裕毅",

const _cache = new Map();
const REQ_TIMEOUT = 6000;       // 6 秒。OpenF1 正常 200–900ms；整段挂住时 6 秒足够判定，早失败早降级

/* ---------- 请求节流 ----------
   OpenF1 的限流比别的源紧得多（实测短时间内连打十来个就会被 429，
   而一次加载本来就要发 6 个请求，刷新几次就撞上了）。
   所以所有 of1 请求统一排队，相邻至少间隔 OF1_GAP，别自己把自己限流。
   撞到 429 时记一个全局静默期，之后所有请求一起等，而不是各自继续撞。 */
const OF1_GAP = 400;            // 相邻请求最小间隔(ms)
let _of1Chain = Promise.resolve();
let _of1Cooldown = 0;           // 429 后的静默截止时间戳

function of1Slot(){
  const p = _of1Chain.then(async () => {
    const wait = Math.max(OF1_GAP, _of1Cooldown - Date.now());
    if(wait > 0) await new Promise(x => setTimeout(x, wait));
  });
  _of1Chain = p.catch(() => {});
  return p;
}

/* =========================================================
   预取包
   ---------------------------------------------------------
   GitHub Actions 每 10 分钟把 OpenF1 的数据抓下来，打包成仓库里的一个静态文件。
   优先读它：一次静态请求顶掉原本的 6 次接口调用，而且完全不碰 OpenF1 的限流
   （实测短时间内连打十来个请求就会被 429，而那正是"比赛后很慢"的主因）。

   读不到、或者包太旧了，就照旧直连 OpenF1。
   ========================================================= */
/* 预取包地址，按顺序试：
     · 同源相对路径 —— 在 GitHub Pages 上就是本站，在本地 server.js 下也能用，不涉及跨域
     · github.io 的绝对地址 —— 内容一样，但国内可达（实测 200 且带 CORS）
     · raw.githubusercontent.com —— 国内经常连不上（实测 ECONNRESET），只作最后兜底

   ⚠️ 每个地址都必须带超时。
   raw.githubusercontent 在部分网络（尤其是国内手机网络）下是"连不上也不拒绝"的黑洞，
   没有超时就会一直挂着 —— 而 of1() 的每个请求都要先等这里，
   结果整个页面卡在「正在获取赛程… 加载中 33%」永远不动。 */
function prefetchUrls(){
  return [
    "data/f1-" + YEAR + ".json",                                   // 按年份归档（多赛季用这个）
    "https://13272045373.github.io/F1/data/f1-" + YEAR + ".json",
    "data/f1.json",                                                // 兼容早期的单文件版
    "https://13272045373.github.io/F1/data/f1.json"
  ];
}
/* 原来还兜底试 raw.githubusercontent.com —— 已去掉：
   那个域名在国内基本连不上，而它不拒绝、只是不回应，
   每次打开都要白等 3 秒超时才有结果。上面两个地址已经覆盖所有实际场景
   （Pages 用同源、本地 file:// 用 github.io）。 */
const PREFETCH_TIMEOUT = 4000;              // 单个地址最多等 4 秒
const PREFETCH_TTL      = 5 * 60 * 1000;    // 同一次会话里，5 分钟内不重复读
const PREFETCH_MAX_AGE  = 40 * 60 * 1000;   // 包里的 updated 超过 40 分钟就当它不新鲜，改直连

let _pfP = null, _pfAt = 0, _pfData = null, _pfWarned = false;

/* 带超时的 JSON 请求。fetch 默认没有超时，遇到黑洞地址会挂很久。 */
async function fetchJsonTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }finally{ clearTimeout(timer); }
}

function prefetch(){
  if(_pfData && (Date.now() - _pfAt) < PREFETCH_TTL) return Promise.resolve(_pfData);
  if(_pfP) return _pfP;                    // 6 个请求同时来，只发一次
  const errs = [];
  _pfP = (async () => {
    for(const url of prefetchUrls()){
      try{
        const j = await fetchJsonTimeout(url, PREFETCH_TIMEOUT);
        if(!j || !Array.isArray(j.meetings)) throw new Error("内容不对");
        /* 包里自带年份 —— 对不上就不能用，否则切到 2025 会显示 2026 的数据 */
        if(j.year != null && Number(j.year) !== YEAR) throw new Error("包里是 " + j.year + " 赛季");
        const age = Date.now() - new Date(j.updated).getTime();
        if(!(age < PREFETCH_MAX_AGE)) throw new Error("包太旧（" + Math.round(age / 60000) + " 分钟前）");
        _pfData = j; _pfAt = Date.now();
        return j;
      }catch(e){
        errs.push(url.replace(/^https?:\/\/[^\/]+/, "").slice(0, 40) + " → " +
                  (e.name === "AbortError" ? "超时" : e.message));
      }
    }
    if(!_pfWarned){
      console.warn("[F1助手] 预取包用不上，改直连 OpenF1 —— " + errs.join(" | "));
      _pfWarned = true;
    }
    _pfData = null; _pfAt = Date.now();
    return null;
  })().finally(() => { _pfP = null; });
  return _pfP;
}

/* 把 OpenF1 的请求路径映射到预取包里的切片。
   映射不了、或者请求的范围比包里存的还大，就返回 undefined 让上层去直连。 */
function of1FromBundle(pathStr, b){
  const q = pathStr.split("?")[1] || "";
  const p = pathStr.split("?")[0];
  const ge = k => { const m = new RegExp(k + ">=(\\d+)").exec(q); return m ? Number(m[1]) : null; };
  const eq = k => { const m = new RegExp(k + "=(\\d+)").exec(q);   return m ? Number(m[1]) : null; };

  if(p === "/meetings") return b.meetings;
  if(p === "/sessions") return b.sessions;

  if(p === "/drivers"){
    const n = ge("meeting_key");
    if(n === null || (b.minMk != null && n < b.minMk)) return undefined;
    return b.drivers.filter(d => d.meeting_key >= n);
  }
  if(p === "/session_result"){
    const n = ge("session_key");
    if(n === null || (b.minKey != null && n < b.minKey)) return undefined;
    return b.results.filter(r => r.session_key >= n);
  }
  if(p === "/championship_drivers") return eq("session_key") === b.champKey ? b.champDrivers : undefined;
  if(p === "/championship_teams")   return eq("session_key") === b.champKey ? b.champTeams   : undefined;
  return undefined;
}

function of1(path, retries = 2){
  const url = OF1 + path;
  const hit = _cache.get(url);
  if(hit && Date.now() - hit.t < CACHE_TTL) return hit.p;

  const p = (async () => {
    // 先看预取包里有没有
    const b = await prefetch();
    if(b){
      const sliced = of1FromBundle(path, b);
      if(sliced !== undefined) return sliced;
    }
    // 走到这里说明预取包没覆盖这次请求 —— 直连 OpenF1
    for(let i = 0; i <= retries; i++){
      await of1Slot();        // 排队 + 节流，避免触发 429
      // 用 AbortController 加超时：网络卡住时会中断并重试，不会一直挂着
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), REQ_TIMEOUT);
      try{
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        /* 401/403/404 重试也没用（OpenF1 比赛期间锁站正是 401）。
           以前这几种也重试，白等 1.5s+3s —— 这是"比赛后打开变慢"的主因之一。 */
        if(r.status === 401 || r.status === 403 || r.status === 404){
          throw Object.assign(new Error("HTTP " + r.status), { noRetry: true });
        }
        /* 429 限流：退避要够长才有意义，并优先尊重服务端的 Retry-After */
        if(r.status === 429){
          const ra = parseInt(r.headers.get("retry-after") || "0", 10);
          const cool = ra > 0 ? Math.min(ra * 1000, 20000) : 6000;
          _of1Cooldown = Date.now() + cool;     // 让后面排队的请求一起等，别再撞
          if(i === 0){
            await new Promise(x => setTimeout(x, cool));
            continue;
          }
          throw Object.assign(new Error("接口限流（HTTP 429）"), { noRetry: true });
        }
        if(r.status >= 500){
          if(i < retries){ await new Promise(x => setTimeout(x, 800 * (i + 1))); continue; }
          throw new Error("服务端错误（HTTP " + r.status + "）");
        }
        if(!r.ok) throw Object.assign(new Error("HTTP " + r.status), { noRetry: true });
        return await r.json();
      }catch(e){
        clearTimeout(timer);
        /* noRetry（401/403/404/429）一次都不重试 */
        if(e && e.noRetry){ _cache.delete(url); throw e; }
        /* 连接超时/被中断 = 服务端根本没应答（实测 OpenF1 的 /v1 会整段挂住）。
           这种情况重试两轮只是把 6 秒拖成 18 秒，只给一次机会，早点降级到备用源。 */
        const maxTry = (e && (e.name === "AbortError" || e.name === "TimeoutError")) ? 1 : retries;
        if(i >= maxTry){ _cache.delete(url); throw e; }
        await new Promise(x => setTimeout(x, 800 * (i + 1)));
      }
    }
  })();
  _cache.set(url, { t: Date.now(), p });
  return p;
}

/* =========================================================
   Jolpica 备用源
   ---------------------------------------------------------
   为什么需要：OpenF1 在 F1 比赛进行期间会锁掉整个 API，返回 401
   {"detail":"Live F1 session in progress. Global API access (including
    past sessions) is restricted to authenticated users until the session
    ends."} —— 而那正好是用户最想查成绩的时候。Jolpica 没这个限制。

   Jolpica 是 Ergast 的续作，返回的是 Ergast 那套 MRData 结构。
   代价：没有车手照片、没有车队配色、赛后同步比 OpenF1 慢一些。
   所以它只在 OpenF1 失败时启用，平时完全不参与。
   ========================================================= */
const JOL = "https://api.jolpi.ca/ergast/f1";

function jolGet(path, retries = 2){
  const url = JOL + path;
  const hit = _cache.get(url);
  if(hit && Date.now() - hit.t < CACHE_TTL) return hit.p;
  const p = (async () => {
    for(let i = 0; i <= retries; i++){
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), REQ_TIMEOUT);
      try{
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if(r.status === 400 || r.status === 404){
          throw Object.assign(new Error("HTTP " + r.status), { noRetry: true });
        }
        if(r.status === 429){
          if(i === 0){
            const ra = parseInt(r.headers.get("retry-after") || "0", 10);
            await new Promise(x => setTimeout(x, ra > 0 ? Math.min(ra * 1000, 15000) : 4000));
            continue;
          }
          throw Object.assign(new Error("Jolpica 限流（HTTP 429）"), { noRetry: true });
        }
        if(r.status >= 500){
          if(i < retries){ await new Promise(x => setTimeout(x, 700 * (i + 1))); continue; }
          throw new Error("Jolpica 服务端错误（HTTP " + r.status + "）");
        }
        if(!r.ok) throw Object.assign(new Error("HTTP " + r.status), { noRetry: true });
        return await r.json();
      }catch(e){
        clearTimeout(timer);
        if((e && e.noRetry) || i >= retries){ _cache.delete(url); throw e; }
        await new Promise(x => setTimeout(x, 700 * (i + 1)));
      }
    }
  })();
  _cache.set(url, { t: Date.now(), p });
  return p;
}

/* Jolpica 分页有坑：limit 上限 100，而 offset 是按「返回行数」算的，
   不是按场次。所以想拿整季必须翻页，不能按 round 切。
   每页把 (race, row) 拆平存下来，后面按 round 归类。 */
async function jolPaged(path, key, maxPages = 16){
  const sep = path.includes("?") ? "&" : "?";
  const flat = j => {
    const MR = j && j.MRData;
    if(!MR) return { total: 0, rows: [] };
    const rows = [];
    for(const race of ((MR.RaceTable && MR.RaceTable.Races) || [])){
      const list = race[key];
      if(!Array.isArray(list)) continue;
      for(const row of list) rows.push({ race, row });
    }
    return { total: parseInt(MR.total || "0", 10) || 0, rows };
  };

  /* 先只拉第 0 页，顺便拿到 total 算出总页数；
     剩下的页并行拉（每页错开 120ms，避免触发 Jolpica 限流）。
     以前是 for-await 串行翻页，整季要十几页 = 十几秒。 */
  const first = flat(await jolGet(`${path}${sep}limit=100&offset=0`));
  const out = first.rows.slice();
  if(!first.total || out.length >= first.total) return out;

  const pages = Math.min(maxPages, Math.ceil(first.total / 100));
  const jobs = [];
  for(let p = 1; p < pages; p++) jobs.push(p);
  const results = await Promise.all(jobs.map((p, i) =>
    new Promise(res => setTimeout(res, i * 120))
      .then(() => jolGet(`${path}${sep}limit=100&offset=${p * 100}`))
      .then(flat)
      .catch(() => ({ total: 0, rows: [] }))
  ));
  for(const r of results) out.push(...r.rows);
  return out;
}

/* "1:32:45.123" / "1:23.456" / "45.123" -> 秒 */
function timeToSec(s){
  if(!s || typeof s !== "string") return null;
  const p = s.trim().split(":").map(Number);
  if(!p.length || p.some(isNaN)) return null;
  if(p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if(p.length === 2) return p[0] * 60 + p[1];
  return p[0];
}

/* Ergast 的完赛状态 -> 本 App 的 dnf / dsq / dns 标记 */
function ergastStatus(row){
  const t = (row.positionText || "").toUpperCase();
  const st = (row.status || "").toLowerCase();
  if(t === "D" || st.includes("disqualif")) return { dsq: 1 };
  if(t === "E" || st.includes("excluded"))  return { dsq: 1 };
  if(t === "W" || st.includes("withdraw"))  return { dns: 1 };
  if(t === "F" || st.includes("failed to qualify")) return { dns: 1 };
  if(t === "R" || t === "N" || st === "accident" || st.includes("collision") ||
     st.includes("engine") || st.includes("gearbox") || st.includes("hydraulics") ||
     st.includes("electrical") || st.includes("spun off") || st.includes("retired") ||
     st.includes("damage") || st.includes("brakes") || st.includes("overheating") ||
     st.includes("mechanical") || st.includes("wheel") || st.includes("suspension") ||
     st.includes("fuel") || st.includes("tyre") || st.includes("oil") ||
     st.includes("water") || st.includes("puncture") || st.includes("illness") ||
     st.includes("injury") || st.includes("power unit") || st.includes("driveshaft") ||
     st.includes("clutch") || st.includes("vibration") || st.includes("ignition") ||
     st.includes("exhaust") || st.includes("throttle") || st.includes("steering") ||
     st.includes("technical") || st.includes("debris") || st.includes("seat") ||
     st.includes("rear wing") || st.includes("front wing")) return { dnf: 1 };
  return null;
}

/* =========================================================
   本地缓存
   ========================================================= */
/* 持久化缓存说明：
   · meetings(20KB) / sessions(47KB) —— 直接存
   · drivers —— API 原始返回 1.1MB（2771 条，同一车手在每个 session 重复一份），
     去重成「每分站每车手一条」后只有 ~300 条 / ~80KB，才适合写 localStorage。
     1.16MB 的同步写入在手机上会明显卡顿甚至超配额，这是之前“卡在 60%”的元凶。 */
let _store = { meetings: null, meetingsAt: 0, sessions: null, sessionsAt: 0, drivers: null, driversAt: 0,
                result: null, resultAt: 0 };
/* 读本地缓存。抽成函数是为了切赛季时能重新读一遍 ——
   每个赛季的缓存存在不同的键下（LSK() 里带年份）。 */
function loadStore(){
  try{
    const raw = localStorage.getItem(LSK());
    if(raw) _store = Object.assign(_store, JSON.parse(raw));
  }catch(e){}
}
/* 切赛季前把内存里的缓存清干净。
   否则新赛季取数失败时会退回上一个赛季的缓存，显示出错年份的数据。 */
function clearStore(){
  _store = { meetings: null, meetingsAt: 0, sessions: null, sessionsAt: 0, drivers: null, driversAt: 0,
             result: null, resultAt: 0 };
}
loadStore();

function saveStore(){
  try{ localStorage.setItem(LSK(), JSON.stringify(_store)); }catch(e){}
}

/* ---------- 结果快照 ----------
   比 _store 更「成品」的一层：把组装好的成绩/积分榜存一份。
   两个数据源都连不上时用它顶上，至少不是一片白屏。
   注意体积：这是同步写 localStorage，之前 1.16MB 的写入把手机卡死过，
   所以只存渲染要用的字段，不含原始 API 响应，也不含车手信息（那个走 _store.drivers）。 */
const SNAP_TTL = 7 * 24 * 60 * 60 * 1000;

function saveSnapshot(){
  try{
    localStorage.setItem(LSK() + "_snap", JSON.stringify({
      at: Date.now(),
      races: S.races,
      results: S.results,
      quali: S.quali,
      sprint: S.sprint,
      sprintq: S.sprintq,
      ds: S.ds,
      cs: S.cs,
      standingsRound: S.standingsRound,
      standingsMeeting: S.standingsMeeting
    }));
  }catch(e){ /* 超配额就算了，不能影响主流程 */ }
}

function loadSnapshot(){
  try{
    const raw = localStorage.getItem(LSK() + "_snap");
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.races) || !s.races.length) return null;
    if(Date.now() - (s.at || 0) > SNAP_TTL) return null;
    return s;
  }catch(e){ return null; }
}

function applySnapshot(s){
  S.races = s.races || [];
  S.results = s.results || {};
  S.quali   = s.quali   || {};
  S.sprint  = s.sprint  || {};
  S.sprintq = s.sprintq || {};
  S.ds = s.ds || [];
  S.cs = s.cs || [];
  S.standingsRound   = (s.standingsRound === undefined)   ? null : s.standingsRound;
  S.standingsMeeting = (s.standingsMeeting === undefined) ? null : s.standingsMeeting;
  S.cachedAt = s.at;
  S.source = "cache";
  S.failed = [];
  /* 车手信息不在快照里（太大），从 _store.drivers 重建。
     那份缓存 3 天有效，赛季内车手名单不变，够用。 */
  const roster = {};
  for(const d of (_store.drivers || [])){
    if(roster[d.driver_number]) continue;
    roster[d.driver_number] = {
      number: d.driver_number,
      name: d.full_name,
      acronym: d.name_acronym,
      team: d.team_name,
      colour: "#" + (d.team_colour || "888888"),
      photo: photoOf(d.driver_number) || d.headshot_url || null,
      country: d.country_code
    };
  }
  S.drivers = {};
  for(const r of S.races){
    const bucket = {};
    for(const num of Object.keys(roster)) bucket[num] = roster[num];
    S.drivers[r.meeting_key] = bucket;   // 各分站共用同一对象，不复制
  }
  S.loaded = true;
}

/* =========================================================
   状态
   ========================================================= */
const S = {
  races: [],          // [{round, name, location, country, flag, date, circuit, sessions:{quali,sprint,race}}]
  results: {},        // round -> [row]
  quali: {},          // round -> [row]
  sprint: {},         // round -> [row]
  drivers: {},        // meeting_key -> { driver_number: {...} }
  ds: [],             // driver standings
  cs: [],             // constructor standings
  failed: [],
  loaded: false
};

/* =========================================================
   数据加载
   ========================================================= */
function sessionNameOf(s){ return s.session_name; }

/* =========================================================
   官方数据补齐
   ---------------------------------------------------------
   F1 官方计时数据（livetiming.formula1.com）数据最全、没有任何限流，
   但它【没有 CORS】，浏览器里的静态页面调不到。
   所以由一个 GitHub Action 在服务端抓下来、存成仓库里的静态 JSON，
   前端再从 raw.githubusercontent.com 读（raw 是有 CORS 的）。

   这里只做【补缺】：OpenF1 / Jolpica 已经取到的场次一律不动，
   只把「已经跑完但上游还没同步」的场次补上。
   ========================================================= */
const OFFICIAL_JSON = "https://raw.githubusercontent.com/13272045373/F1/main/data/f1.json";
const OFFICIAL_TTL  = 10 * 60 * 1000;
let _officialCache = { at: 0, data: null };

async function fillFromOfficial(){
  /* 这个方案已废弃：F1 官方 CDN 会 403 拒绝云服务器 IP（2026-10-03 实测），
     而且 data/f1.json 现在装的是「OpenF1 预取包」，结构完全不同。
     保留函数但直接返回 —— 否则它还会去请求一次 raw.githubusercontent，
     那个域名没超时会挂死整个加载。 */
  return 0;
  /* eslint-disable no-unreachable */
  try{
    if(!_officialCache.data || (Date.now() - _officialCache.at) > OFFICIAL_TTL){
      const r = await fetch(OFFICIAL_JSON, { cache: "no-store" });
      if(!r.ok) return 0;
      const j = await r.json();
      if(!j || !j.sessions) return 0;
      _officialCache = { at: Date.now(), data: j };
    }
    const sessions = _officialCache.data.sessions;
    let filled = 0;

    for(const rc of S.races){
      for(const kind of ["quali", "sprint"]){
        const key = rc.sessions[kind];
        if(!key) continue;
        const bucket = kind === "quali" ? S.quali : S.sprint;
        if(bucket[rc.round] && bucket[rc.round].length) continue;   // 已有数据，不覆盖
        const s = sessions[String(key)];
        if(!s || !Array.isArray(s.results) || !s.results.length) continue;

        /* 顺带补车手信息：官方 DriverList 有全名/缩写/车队/配色/头像。
           本地那份是按分站分桶的，刚跑完的这一站可能还没有。 */
        const bk = S.drivers[rc.meeting_key] = S.drivers[rc.meeting_key] || {};
        for(const x of s.results){
          if(!x.number || bk[x.number]) continue;
          bk[x.number] = {
            number: x.number,
            name: x.name,
            acronym: x.tla || "",
            team: x.team || "",
            colour: x.colour ? "#" + x.colour : "#888888",
            photo: photoOf(x.number) || x.photo || null,
            country: null
          };
        }

        bucket[rc.round] = s.results.map(x => ({
          driver_number: x.number,
          position: x.position,
          duration: x.bestLapSec != null ? [x.bestLapSec] : [],   // 排位表取数组里最后一个数字
          number_of_laps: x.laps,
          _official: true
        }));
        filled++;
      }
    }
    if(filled) console.log("[F1助手] 用官方数据补齐了 " + filled + " 个阶段");
    return filled;
  }catch(e){
    console.warn("[F1助手] 官方数据补齐失败（不影响其他功能）：", e.message);
    return 0;
  }
}

/* 说明：所有请求都是「串行」的话，5 个请求 × 2.3 秒延迟 ≈ 11 秒。
   实测 openf1.org 单次响应约 2.3s，且响应体大小对耗时影响不大，
   所以提速的关键是「并行」而不是「减小体积」。
   这里分两阶段并行，并让赛程一拿到就先渲染出来。 */
async function loadAll(onProgress, onScheduleReady){
  const P = (d, t, label) => { if(onProgress) onProgress(d, t, label); };

  // ============ 阶段 1：赛程（meetings + sessions 并行）============
  P(1, 3, "获取赛程");
  const needM = !(_store.meetings && (Date.now() - _store.meetingsAt) < SCHEDULE_TTL);
  const needS = !(_store.sessions && (Date.now() - _store.sessionsAt) < SCHEDULE_TTL);

  /* 单个接口抖动时不要连累整体：有本地缓存就先用缓存。
      OpenF1 的 /sessions 实测会间歇性 10 秒超时，而 Promise.all 里只要有一个挂掉，
      整个 loadAll 就抛错 → 切到要翻十几页的 Jolpica 备用源（那才是"慢"的根源）。 */
  let staleM = false, staleS = false;
  const soft = (p, cached, mark, label) => p.catch(e => {
    if(cached){ console.warn("[F1助手] " + label + " 取数失败，改用本地缓存：", e.message); mark(); return cached; }
    throw e;
  });
  const [meetings, sessions] = await Promise.all([
    needM ? soft(of1(`/meetings?year=${YEAR}`), _store.meetings, () => { staleM = true; }, "赛程")
          : Promise.resolve(_store.meetings),
    needS ? soft(of1(`/sessions?year=${YEAR}`), _store.sessions, () => { staleS = true; }, "场次")
          : Promise.resolve(_store.sessions)
  ]);
  /* 用缓存兜底时不刷新时间戳，否则会把过期数据再续期 3 天 */
  if(needM && !staleM){ _store.meetings = meetings; _store.meetingsAt = Date.now(); }
  if(needS && !staleS){ _store.sessions = sessions; _store.sessionsAt = Date.now(); }
  if((needM && !staleM) || (needS && !staleS)) saveStore();

  // ---- 组装赛程：排除测试赛与已取消，按日期排序编号 ----
  const byMeeting = {};
  for(const s of sessions){
    (byMeeting[s.meeting_key] = byMeeting[s.meeting_key] || []).push(s);
  }
  const real = meetings
    .filter(m => !m.is_cancelled)
    .filter(m => (byMeeting[m.meeting_key] || []).some(s => s.session_name === "Race"))
    .sort((a, b) => new Date(a.date_start) - new Date(b.date_start));

  S.races = real.map((m, i) => {
    const list = byMeeting[m.meeting_key] || [];
    const find = nm => list.find(s => s.session_name === nm) || null;
    const q  = find("Qualifying");
    const sp = find("Sprint");
    const sq = find("Sprint Qualifying");
    const rc = find("Race");
    return {
      round: i + 1,
      meeting_key: m.meeting_key,
      name: m.meeting_name,
      official: m.meeting_official_name,
      location: m.location,
      country: m.country_name,
      flag: m.country_flag,
      weekendStart: (m.date_start || "").slice(0, 10),
      circuit: m.circuit_short_name,
      /* 正赛日（北京时区）。
         以前这里用的是 meeting.date_start —— 那是周末第一天（周五），
         不是正赛日，所以赛程上显示的日期一直是错的。 */
      date: bjDate(rc && rc.date_start) || (m.date_start || "").slice(0, 10),
      /* 各阶段真实开赛时间（UTC ISO）。显示时用 fmtSession 转北京时间。 */
      times: {
        sprintq: sq ? sq.date_start : null,
        sprint:  sp ? sp.date_start : null,
        quali:   q  ? q.date_start : null,
        race:    rc ? rc.date_start : null
      },
      /* 各阶段的结束时间。「本周比赛」焦点区要靠它判断
         某个阶段是"进行中"还是"已结束"，光有开始时间不够。 */
      ends: {
        sprintq: sq ? sq.date_end : null,
        sprint:  sp ? sp.date_end : null,
        quali:   q  ? q.date_end : null,
        race:    rc ? rc.date_end : null
      },
      raceStart: rc ? rc.date_start : m.date_start,
      raceEnd:   rc ? rc.date_end   : m.date_end,
      /* 四个阶段都要登记 session_key —— 取数范围（pastKeys）和
         结果归类都从这张表推。以前漏了 sprintq，导致冲刺排位的成绩
         根本没去请求、也没有对应的结果桶。 */
      sessions: {
        sprintq: sq ? sq.session_key : null,
        sprint:  sp ? sp.session_key : null,
        quali:   q  ? q.session_key : null,
        race:    rc ? rc.session_key : null
      }
    };
  });

  const now = Date.now();
  /* 「已完赛」以正赛结束时间为准。
     以前用分站开始日（周五）的 23:59 去比 —— 周六就认为周日的比赛已结束，
     会去拉还没产生的成绩，然后误报「上游数据源尚未同步」。 */
  const past = S.races.filter(r => r.raceEnd && new Date(r.raceEnd).getTime() < now);
  // 赛程已就绪 → 先让界面把它渲染出来，用户不用干等后面的数据
  if(onScheduleReady) onScheduleReady();

  // ============ 阶段 2：车手 / 成绩 / 积分榜（三者并行）============
  P(2, 3, "获取成绩与积分榜");

  /* 光看 TTL 不够：缓存里必须已经覆盖「所有已经开始过的分站」。
     否则就会出现「成绩有了、但车手名字和头像没有」——
     因为 drivers 缓存是旧的，而 TTL 还早，不会自动刷新。
     这条检查让它自愈，不用再靠手动清缓存。 */
  const cachedMk = new Set((_store.drivers || []).map(d => d.meeting_key));
  const needMk = new Set();
  for(const r of S.races){
    const t = r.times.quali || r.times.race;
    if(t && new Date(t).getTime() < now) needMk.add(r.meeting_key);
  }
  const missMk = [...needMk].filter(mk => !cachedMk.has(mk));
  if(missMk.length && _store.drivers){
    console.warn("[F1助手] 车手缓存缺 " + missMk.length + " 个分站（" + missMk.join(",") + "），强制重新拉取");
  }
  const needD = missMk.length > 0
    || !(_store.drivers && _store.driversAt && (Date.now() - _store.driversAt) < SCHEDULE_TTL);
  const minMk  = S.races.length ? Math.min(...S.races.map(r => r.meeting_key)) : null;

  // 需要哪些 session（已完赛的排位/冲刺/正赛）
  const pastKeys = [];
  for(const r of past){
    // 四个阶段都要取。顺序按比赛周末的时间先后。
    for(const k of ["sprintq","quali","sprint","race"]){
      if(r.sessions[k]) pastKeys.push({ round: r.round, kind: k, key: r.sessions[k] });
    }
  }
  const minKey  = pastKeys.length ? Math.min(...pastKeys.map(x => x.key)) : null;
  const lastPast = past.length ? past[past.length - 1] : null;
  const champKey = lastPast && lastPast.sessions.race ? lastPast.sessions.race : null;

  /* 成绩表也做本地缓存：10 分钟内重开页面不用再拉（这是整季数据，几百 KB）。
     并且单独特判失败 —— 以前它一挂，整个 loadAll 就完蛋，白白降级到慢的备用源。 */
  const needR = !(_store.result && _store.resultAt && (Date.now() - _store.resultAt) < RESULT_TTL);
  const rowsP = (minKey === null)
    ? Promise.resolve(null)
    : (needR
        ? of1(`/session_result?session_key>=${minKey}`).catch(e => {
            if(_store.result){ console.warn("[F1助手] 成绩取数失败，改用本地缓存：", e.message); return _store.result; }
            throw e;
          })
        : Promise.resolve(_store.result));

  const [fullDrivers, rows, champ] = await Promise.all([
    (needD && minMk !== null) ? of1(`/drivers?meeting_key>=${minMk}`) : Promise.resolve(null),
    rowsP,
    champKey
      ? Promise.allSettled([
          of1(`/championship_drivers?session_key=${champKey}`),
          of1(`/championship_teams?session_key=${champKey}`)
        ])
      : Promise.resolve([{ status:"fulfilled", value:[] }, { status:"fulfilled", value:[] }])
  ]);

  /* 缓存成绩，但要防体积：整季数据会长到几百 KB，localStorage 有上限 */
  if(rows && needR){
    const packed = JSON.stringify(rows);
    if(packed.length < 1500000){
      _store.result = rows;
      _store.resultAt = Date.now();
      saveStore();
    } else {
      console.warn("[F1助手] 成绩数据过大（" + Math.round(packed.length / 1024) + " KB），本次不写本地缓存");
    }
  }

  P(3, 3, "整理数据");

  // ---- 车手信息（去重后才缓存，避免 1MB 级写入）----
  let driversRaw = _store.drivers;
  if(needD && fullDrivers){
    /* 原来只留「已完赛分站」，导致刚跑完排位、正赛还没跑的这一站
       （raceEnd 在未来）车手信息被过滤掉，排位成绩表里就没有车手名/头像。
       改成保留全部分站；下面的去重逻辑不变，量级仍是几百条。 */
    const pastMk = new Set(S.races.map(r => r.meeting_key));
    const seen = new Set();
    driversRaw = [];
    for(const d of fullDrivers){
      if(!pastMk.has(d.meeting_key)) continue;
      const k = d.meeting_key + ":" + d.driver_number;
      if(seen.has(k)) continue;       // 同一分站同一车手只留一条
      seen.add(k);
      driversRaw.push(d);
    }
    _store.drivers = driversRaw;
    _store.driversAt = Date.now();
    saveStore();
  }
  S.drivers = {};
  for(const d of (driversRaw || [])){
    const bucket = S.drivers[d.meeting_key] = S.drivers[d.meeting_key] || {};
    if(!bucket[d.driver_number]){
      bucket[d.driver_number] = {
        number: d.driver_number,
        name: d.full_name,
        acronym: d.name_acronym,
        team: d.team_name,
        colour: "#" + (d.team_colour || "888888"),
        photo: photoOf(d.driver_number) || d.headshot_url || null,
        country: d.country_code
      };
    }
  }

  // ---- 成绩 ----
  S.results = {}; S.quali = {}; S.sprint = {}; S.sprintq = {};
  S.failed = [];
  if(rows){
    const byKey = {};
    for(const r of rows) (byKey[r.session_key] = byKey[r.session_key] || []).push(r);
    /* 归类范围必须是「所有分站」，不能只用已完赛的 pastKeys。
       past 是按正赛(周日)结束时间筛的，而排位赛在周六 ——
       周六排位刚跑完时这一站的 raceEnd 还没到，整站落在 past 之外，
       于是 API 明明返回了排位成绩，这个循环却把它整站跳过，
       界面就显示「本站无此阶段数据」。
       改成遍历全部分站：没数据的 byKey[key] 自然为空、continue 跳过。 */
    for(const r of S.races){
      for(const k of ["sprintq", "quali", "sprint", "race"]){
        const key = r.sessions[k];
        if(!key) continue;
        const list = (byKey[key] || []).slice().sort((a, b) => {
          const pa = a.position ?? 999, pb = b.position ?? 999;
          return pa - pb;
        });
        if(!list.length) continue;
        if(k === "race")         S.results[r.round] = list;
        else if(k === "quali")   S.quali[r.round]   = list;
        else if(k === "sprint")  S.sprint[r.round]  = list;
        else                     S.sprintq[r.round] = list;
      }
    }
  }

  // ---- 积分榜 ----
  S.ds = []; S.cs = [];
  if(champ && champ[0] && champ[0].status === "fulfilled") S.ds = champ[0].value || [];
  if(champ && champ[1] && champ[1].status === "fulfilled") S.cs = champ[1].value || [];
  if(lastPast){
    S.standingsRound = lastPast.round;
    S.standingsMeeting = lastPast.meeting_key;
  }

  S.source = "openf1";
  S.cachedAt = null;
  saveSnapshot();
  S.loaded = true;
  return past.length;
}

/* =========================================================
   备用源加载：Jolpica
   ========================================================= */
/* Jolpica 给的国家名 -> 国旗图。只在没有 OpenF1 缓存时才用到。 */
const COUNTRY_CC = {
  "Australia":"au","China":"cn","Japan":"jp","Bahrain":"bh","Saudi Arabia":"sa",
  "USA":"us","United States":"us","Italy":"it","Monaco":"mc","Spain":"es",
  "Canada":"ca","Austria":"at","UK":"gb","United Kingdom":"gb","Great Britain":"gb",
  "Hungary":"hu","Belgium":"be","Netherlands":"nl","Azerbaijan":"az","Singapore":"sg",
  "Mexico":"mx","Brazil":"br","Qatar":"qa","UAE":"ae","United Arab Emirates":"ae",
  "Malaysia":"my","Portugal":"pt","Turkey":"tr","France":"fr","Germany":"de",
  "Korea":"kr","South Korea":"kr","India":"in","South Africa":"za","Switzerland":"ch"
};
function flagUrl(country){
  const cc = COUNTRY_CC[country];
  return cc ? "https://flagcdn.com/w40/" + cc + ".png" : null;
}

/* 车手照片 / 车队色：优先用 OpenF1 之前缓存下来的（3 天内有效），
   这样切到备用源时头像和配色不会突然消失。 */
function cachedDriver(num){
  const list = _store.drivers;
  if(!Array.isArray(list)) return null;
  return list.find(x => x.driver_number === num) || null;
}
function bestPhoto(num){
  const cdn = photoOf(num);
  if(cdn) return cdn;
  const d = cachedDriver(num);
  return (d && d.headshot_url) || null;
}
function bestColour(num, fallback){
  const d = cachedDriver(num);
  if(d && d.team_colour) return "#" + d.team_colour;
  return fallback;
}

/* Jolpica 不给排位/冲刺的开赛时间。
   如果本地还留着 OpenF1 的 meetings/sessions 缓存（3 天），
   按「分站日期区间」匹配，把时间补回来。匹配不上就留空 ——
   sessionLines() 会自动跳过没有时间的阶段，不会显示 "—"。 */
function mergeSessionTimes(races){
  const ms = _store.meetings, ss = _store.sessions;
  if(!Array.isArray(ms) || !Array.isArray(ss)) return 0;
  const byMeeting = {};
  for(const s of ss) (byMeeting[s.meeting_key] = byMeeting[s.meeting_key] || []).push(s);
  let n = 0;
  for(const r of races){
    const rd = new Date(r.date + "T12:00:00Z").getTime();
    const m = ms.find(x => {
      if(x.is_cancelled) return false;
      const a = new Date(x.date_start).getTime() - 36 * 3600 * 1000;
      const b = new Date(x.date_end).getTime()   + 36 * 3600 * 1000;
      return rd >= a && rd <= b;
    });
    if(!m) continue;
    const list = byMeeting[m.meeting_key] || [];
    const find = nm => (list.find(s => s.session_name === nm) || {}).date_start || null;
    r.times.race    = r.times.race    || find("Race");
    r.times.quali   = r.times.quali   || find("Qualifying");
    r.times.sprint  = r.times.sprint  || find("Sprint");
    r.times.sprintq = r.times.sprintq || find("Sprint Qualifying");
    if(!r.flag && m.country_flag) r.flag = m.country_flag;
    n++;
  }
  return n;
}

async function loadFromJolpica(onProgress){
  const P = (d, t, label) => { if(onProgress) onProgress(d, t, label); };

  /* ---- 1. 赛程 ---- */
  P(1, 3, "备用源：获取赛程");
  const sch  = await jolGet(`/${YEAR}/races.json?limit=100`);
  const jRaces = (sch.MRData && sch.MRData.RaceTable && sch.MRData.RaceTable.Races) || [];
  if(!jRaces.length) throw new Error("Jolpica 没返回赛程");

  /* Jolpica 的 races.json 里带了各阶段的日期和时间
     （FirstPractice / SecondPractice / ThirdPractice / Qualifying / Sprint / SprintQualifying），
     所以备用源也能显示各阶段的开赛时间，不只是正赛。
     注意「冲刺排位」的时间它现在是给的（字段 SprintQualifying），直接读；
     以前这里写着「Ergast 没这个字段」，是过时的判断，导致备用源下
     冲刺排位整块消失。它唯一缺的是冲刺排位的【成绩】—— 没有对应端点。

     date 必须按北京时区算：Jolpica 的 r.date 是当地日期，
     美洲站在北京时间会跨天，直接用它会和下面的开赛时间自相矛盾。 */
  const joinIso = (d, t) => (d ? (t ? `${d}T${t}` : `${d}T12:00:00Z`) : null);

  S.races = jRaces.map((r, i) => {
    const round = parseInt(r.round, 10) || (i + 1);
    const loc   = (r.Circuit && r.Circuit.Location) || {};
    const raceIso   = joinIso(r.date, r.time);
    const qualiIso  = r.Qualifying ? joinIso(r.Qualifying.date, r.Qualifying.time) : null;
    const sprintIso = r.Sprint     ? joinIso(r.Sprint.date,     r.Sprint.time)     : null;
    /* Jolpica 的 races.json 里其实是有「冲刺排位」的，字段名 SprintQualifying。
       以前这里只读了 Qualifying 和 Sprint，于是备用源下冲刺排位整块凭空消失
       （OpenF1 锁站降级时就会看到这个现象）。
       注意：它只给时间，不给成绩 —— Jolpica 没有冲刺排位的成绩端点。 */
    const sprintqIso = r.SprintQualifying
      ? joinIso(r.SprintQualifying.date, r.SprintQualifying.time) : null;
    const start = new Date(raceIso);
    const end   = new Date(start.getTime() + 2 * 3600 * 1000);
    return {
      round,
      meeting_key: round,          // Jolpica 没有 meeting_key，用轮次代替
      name: r.raceName,
      official: r.raceName,
      location: loc.locality || "",
      country: loc.country || "",
      flag: flagUrl(loc.country),
      date: bjDate(raceIso) || r.date,
      circuit: (r.Circuit && r.Circuit.circuitName) || "",
      times: { sprintq: sprintqIso, sprint: sprintIso, quali: qualiIso, race: raceIso },
      /* Jolpica 只给开始时间，没给结束时间 —— 按 F1 标准时长估：
         冲刺排位 60 分、冲刺赛 60 分、排位 75 分、正赛 150 分（上限 2 小时留余量）。 */
      ends: {
        sprintq: sprintqIso ? new Date(new Date(sprintqIso).getTime() + 60 * 60000).toISOString() : null,
        sprint:  sprintIso  ? new Date(new Date(sprintIso).getTime()  + 60 * 60000).toISOString() : null,
        quali:   qualiIso   ? new Date(new Date(qualiIso).getTime()   + 75 * 60000).toISOString() : null,
        race:    isNaN(end) ? null : end.toISOString()
      },
      raceStart: raceIso,
      raceEnd: isNaN(end) ? null : end.toISOString(),
      /* sprint 只在该站真有冲刺赛时才有值。
         之前一律填轮次号，结果每一站都被标上「冲刺」徽章。 */
      /* Ergast 没有「冲刺排位」的成绩，也拿不到它的 session_key，
         所以这里恒为 null。时间由 mergeSessionTimes 从 OpenF1 缓存补；
         补到了就会渲染出这一块，成绩为空时提示「备用源不提供」。 */
      sessions: { sprintq: null, quali: round, sprint: r.Sprint ? round : null, race: round }
    };
  });

  mergeSessionTimes(S.races);
  if(onProgress) onProgress(1, 3, "备用源：获取赛程");

  /* ---- 2. 成绩（整季翻页拉）---- */
  P(2, 3, "备用源：获取成绩");
  const [raceRows, qualiRows, sprintRows] = await Promise.all([
    jolPaged(`/${YEAR}/results.json`,    "Results"),
    jolPaged(`/${YEAR}/qualifying.json`, "QualifyingResults"),
    jolPaged(`/${YEAR}/sprint.json`,     "SprintResults")
  ]);

  /* ---- 3. 积分榜 ---- */
  P(3, 3, "备用源：获取积分榜");
  const [dsJ, csJ] = await Promise.all([
    jolGet(`/${YEAR}/driverStandings.json`).catch(() => null),
    jolGet(`/${YEAR}/constructorStandings.json`).catch(() => null)
  ]);

  /* ---- 车手名单（从成绩里抽，一个赛季的名单是稳定的）---- */
  const roster = {};
  const absorb = (drv, con, numRaw) => {
    const num = parseInt(numRaw, 10);
    if(!num || roster[num]) return;
    const name = ((drv.givenName || "") + " " + (drv.familyName || "")).trim();
    roster[num] = {
      number: num,
      name,
      acronym: drv.code || (drv.familyName || "???").slice(0, 3).toUpperCase(),
      team: con ? con.name : "",
      colour: bestColour(num, con ? teamColour(con.constructorId) : "#888888"),
      photo: bestPhoto(num),
      country: drv.nationality || null
    };
  };
  for(const { row } of raceRows)  absorb(row.Driver || {}, row.Constructor, row.number);
  for(const { row } of sprintRows) absorb(row.Driver || {}, row.Constructor, row.number);
  for(const { row } of qualiRows) absorb(row.Driver || {}, row.Constructor, row.number);

  S.drivers = {};
  for(const r of S.races){
    const bucket = {};
    for(const num of Object.keys(roster)) bucket[num] = roster[num];
    S.drivers[r.round] = bucket;       // 所有分站共用同一个对象，不复制
  }

  /* ---- 结果归类 ---- */
  const orderPos = (a, b) => (a.position ?? 999) - (b.position ?? 999);

  S.results = {}; S.quali = {}; S.sprint = {}; S.sprintq = {}; S.failed = [];

  // 正赛 / 冲刺赛
  const buildRaceRow = (row, leaderMs) => {
    const out = {
      driver_number: parseInt(row.number, 10),
      position: parseInt(row.position, 10) || null,
      points: parseFloat(row.points) || 0,
      number_of_laps: parseInt(row.laps, 10) || null
    };
    Object.assign(out, ergastStatus(row) || {});
    const ms = row.Time && row.Time.millis ? parseInt(row.Time.millis, 10) : null;
    if(out.position === 1 && row.Time && row.Time.time){
      out.duration = timeToSec(row.Time.time);
    } else if(ms && leaderMs){
      out.gap_to_leader = (ms - leaderMs) / 1000;
    } else if(row.status && /^\+\d+\s*Laps?$/i.test(row.status)){
      out.gap_to_leader = row.status;      // 被套圈，交给 gapText 处理
    }
    return out;
  };

  {
    const byRound = {};
    for(const { race, row } of raceRows){
      const rd = parseInt(race.round, 10);
      (byRound[rd] = byRound[rd] || []).push(row);
    }
    for(const rd of Object.keys(byRound)){
      const list = byRound[rd].slice().sort(orderPos);
      const leader = list.find(x => parseInt(x.position, 10) === 1);
      const leaderMs = leader && leader.Time && leader.Time.millis ? parseInt(leader.Time.millis, 10) : null;
      S.results[rd] = list.map(row => buildRaceRow(row, leaderMs));
    }
  }
  {
    const byRound = {};
    for(const { race, row } of sprintRows){
      const rd = parseInt(race.round, 10);
      (byRound[rd] = byRound[rd] || []).push(row);
    }
    for(const rd of Object.keys(byRound)){
      const list = byRound[rd].slice().sort(orderPos);
      const leader = list.find(x => parseInt(x.position, 10) === 1);
      const leaderMs = leader && leader.Time && leader.Time.millis ? parseInt(leader.Time.millis, 10) : null;
      S.sprint[rd] = list.map(row => buildRaceRow(row, leaderMs));
    }
  }
  {
    // 排位赛：Ergast 给 Q1/Q2/Q3 三段，取最快的一段作为成绩
    const byRound = {};
    for(const { race, row } of qualiRows){
      const rd = parseInt(race.round, 10);
      (byRound[rd] = byRound[rd] || []).push(row);
    }
    for(const rd of Object.keys(byRound)){
      const list = byRound[rd].slice().sort(orderPos);
      S.quali[rd] = list.map(row => {
        const secs = [row.Q1, row.Q2, row.Q3].map(timeToSec).filter(x => x != null);
        const best = secs.length ? Math.min(...secs) : null;
        return {
          driver_number: parseInt(row.number, 10),
          position: parseInt(row.position, 10) || null,
          duration: best != null ? [best] : []   // 单元素数组，sessionTable 取 .pop() 正好拿到
        };
      });
    }
  }

  /* ---- 积分榜 ---- */
  const sl = j => {
    const t = j && j.MRData && j.MRData.StandingsTable;
    return (t && t.StandingsLists && t.StandingsLists[0]) || null;
  };
  const dsList = sl(dsJ), csList = sl(csJ);

  S.ds = ((dsList && dsList.DriverStandings) || []).map(x => {
    const num = parseInt(x.Driver && x.Driver.permanentNumber, 10) || 0;
    return {
      driver_number: num,
      position_current: parseInt(x.position, 10),
      points_current: parseFloat(x.points) || 0
    };
  }).filter(x => x.driver_number);

  S.cs = ((csList && csList.ConstructorStandings) || []).map(x => ({
    team_name: (x.Constructor && x.Constructor.name) || "",
    position_current: parseInt(x.position, 10),
    points_current: parseFloat(x.points) || 0
  }));

  /* 积分榜对应的分站：最后一站有正赛成绩的 */
  const doneRounds = Object.keys(S.results).map(Number).sort((a, b) => a - b);
  const lastDone = doneRounds.length ? doneRounds[doneRounds.length - 1] : null;
  S.standingsRound   = lastDone;
  S.standingsMeeting = lastDone;

  S.source = "jolpica";
  S.cachedAt = null;
  saveSnapshot();
  S.loaded = true;
  return doneRounds.length;
}

/* =========================================================
   行数据 → 显示用对象
   ========================================================= */
function statusText(row){
  if(row.dsq) return "取消资格";
  if(row.dns) return "未发车";
  if(row.dnf) return "退赛";
  return null;
}
function fmtDuration(sec){
  if(typeof sec !== "number" || !isFinite(sec)) return null;
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return m > 0 ? `${m}:${s.toFixed(3).padStart(6, "0")}` : s.toFixed(3);
}
/* 被套圈车手的 gap_to_leader 是字符串，例如 "+1 LAP" / "+2 LAPS" → 译成中文 */
function gapText(s){
  return String(s).replace(/\+\s*(\d+)\s*LAPS?/i, "+$1 圈");
}
/* 把 gap_to_leader 统一成可显示的文本；无法处理时返回 null */
function gapCellOf(row){
  const g = row.gap_to_leader;
  if(typeof g === "number" && isFinite(g)) return "+" + g.toFixed(3);
  if(typeof g === "string" && g.trim())    return gapText(g);
  return null;
}
function driverOf(meetingKey, num){
  return S.drivers?.[meetingKey]?.[num] || null;
}
function avatar(d, fallbackText){
  const txt = esc(d?.acronym || fallbackText || "?");
  const col = d?.colour || "#7a8296";
  if(d?.photo){
    const fb = "this.outerHTML='<span class=\\'av\\' style=\\'background:" + col + "\\'>" + txt + "</span>'";
    return '<img src="' + d.photo + '" alt="' + txt + '" loading="lazy" onerror="' + fb + '">';
  }
  return '<span class="av" style="background:' + col + '">' + txt + '</span>';
}
function driverCell(meetingKey, num){
  const d = driverOf(meetingKey, num);
  if(!d) return '<span class="muted">#' + esc(num) + '</span>';
  const cn = driverCN(d.name);
  const title = cn
    ? esc(cn) + ' <span class="cd">' + esc(d.name) + '</span>'
    : esc(d.name);
  return '<div class="dr">' + avatar(d) +
         '<div><div class="nm">' + title + '</div>' +
         '<div class="cd">' + esc(d.acronym) + ' · #' + esc(d.number) + '</div></div></div>';
}
function teamCell(meetingKey, num){
  const d = driverOf(meetingKey, num);
  if(!d) return '<span class="muted">—</span>';
  return '<div class="team" style="border-color:' + d.colour + '">' + esc(teamCN(d.team)) + '</div>';
}

/* =========================================================
   渲染：赛程
   ========================================================= */
const WEEK_CN = ["周日","周一","周二","周三","周四","周五","周六"];

/* OpenF1 给的时间全是 UTC（形如 2026-03-29T05:00:00+00:00）。
   中国用户要看北京时间 = 固定 UTC+8（中国不用夏令时）。
   注意不能直接截字符串取日期：美洲那些凌晨 UTC 的比赛，
   按 UTC 截出来的日期和北京时间差一天。所以走 Date 换算。 */
const BJ_OFFSET = 8 * 3600 * 1000;
function bjParts(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const t = new Date(d.getTime() + BJ_OFFSET);   // 加 8 小时后按 UTC 字段读
  return {
    y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(),
    hh: String(t.getUTCHours()).padStart(2, "0"),
    mm: String(t.getUTCMinutes()).padStart(2, "0"),
    dow: t.getUTCDay()
  };
}
/* ISO(UTC) -> "YYYY-MM-DD"（北京时区），给 fmtDate 用 */
function bjDate(iso){
  const p = bjParts(iso);
  return p ? `${p.y}-${String(p.m).padStart(2, "0")}-${String(p.d).padStart(2, "0")}` : null;
}
/* ISO(UTC) -> "3月29日 周日 13:00"（北京时区） */
function fmtSession(iso){
  const p = bjParts(iso);
  return p ? `${p.m}月${p.d}日 ${WEEK_CN[p.dow]} ${p.hh}:${p.mm}` : "—";
}
/* "YYYY-MM-DD" -> "3月29日 周日" */
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d + "T12:00:00");
  if(isNaN(dt)) return d;
  return `${dt.getMonth() + 1}月${dt.getDate()}日 ${WEEK_CN[dt.getDay()]}`;
}
function nextRound(){
  const now = Date.now();
  for(const r of S.races){
    if(r.raceEnd && new Date(r.raceEnd).getTime() > now) return r.round;
  }
  return null;
}

/* 赛程行里列出各阶段的北京时间。
   冲刺周末的顺序是：冲刺排位(五) → 冲刺赛(六) → 排位赛(六) → 正赛(日)。 */
function sessionLines(r){
  const t = r.times || {};
  const rows = [];
  // 冲刺排位用 hasStage 判断 —— 有冲刺赛就一定有它，
  // 时间拿不到时显示「时间待定」，而不是整行消失。
  if(hasStage(r, "sprintq")) rows.push(["冲刺排位", t.sprintq, "时间待定"]);
  if(t.sprint)  rows.push(["冲刺赛",   t.sprint]);
  if(t.quali)   rows.push(["排位赛",   t.quali]);
  if(t.race)    rows.push(["正赛",     t.race]);
  if(!rows.length) return "";
  return '<div class="rsess">' + rows.map(function(row){
    const label = row[0], iso = row[1], fallback = row[2];
    const txt = iso ? fmtSession(iso) : (fallback || "—");
    return '<span><i>' + esc(label) + '</i>' + esc(txt) + '</span>';
  }).join("") + '</div>';
}
function flagImg(race){
  if(!race?.flag) return "";
  return '<img class="flag" src="' + esc(race.flag) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
}


/* =========================================================
   焦点区：本周比赛 + 下一站比赛
   ---------------------------------------------------------
   「本周」的判定：周末区间（首个阶段开始前 24 小时 ~ 最后阶段结束后 24 小时）
   覆盖今天的那一站；如果没有（比如周一到周四），就取最近的一站未来比赛。
   「下一站」就是它的下一个 round。
   ========================================================= */
const SESSION_MIN = { sprintq: 60, sprint: 60, quali: 75, race: 150 };   // 拿不到 date_end 时的兜底时长

/* 某个阶段的结束时间戳（毫秒）。优先用接口给的 date_end，没有就按兜底时长估。 */
function sessionEndMs(r, kind){
  const e = r.ends && r.ends[kind];
  if(e){ const t = new Date(e).getTime(); if(!isNaN(t)) return t; }
  const iso = r.times && r.times[kind];
  if(!iso) return null;
  return new Date(iso).getTime() + (SESSION_MIN[kind] || 90) * 60000;
}

/* 本站各阶段 + 状态：live(进行中) / done(已结束) / todo(未开始) */
function raceSessions(r){
  const now = Date.now();
  const out = [];
  for(const [kind, label] of [["sprintq","冲刺排位"],["sprint","冲刺赛"],["quali","排位赛"],["race","正赛"]]){
    const iso = r.times && r.times[kind];
    if(!iso) continue;
    const s = new Date(iso).getTime();
    const e = sessionEndMs(r, kind);
    if(isNaN(s)) continue;
    out.push({ kind, label, iso, s, e: (e == null ? s + 3600000 : e),
               st: (now >= s && now < (e == null ? s + 3600000 : e)) ? "live" : (now >= (e == null ? s + 3600000 : e) ? "done" : "todo") });
  }
  return out;
}

function thisWeekRace(){
  const now = Date.now();
  // 先找"周末区间包含今天"的那一站（前后各放宽一天，周日晚也算本周）
  for(const r of S.races){
    const ss = raceSessions(r);
    if(!ss.length) continue;
    const first = Math.min.apply(null, ss.map(x => x.s));
    const last  = Math.max.apply(null, ss.map(x => x.e));
    if(now >= first - 86400000 && now <= last + 86400000) return r;
  }
  // 没有就取最近的一站未来比赛
  let best = null, bestT = Infinity;
  for(const r of S.races){
    const ss = raceSessions(r);
    if(!ss.length) continue;
    const t = Math.min.apply(null, ss.map(x => x.s));
    if(t > now && t < bestT){ bestT = t; best = r; }
  }
  return best;
}

function countdownText(ms){
  if(ms <= 0) return "即将开始";
  const m = Math.floor(ms / 60000);
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
  if(d > 0) return d + " 天 " + h + " 小时";
  if(h > 0) return h + " 小时 " + mi + " 分";
  return mi + " 分钟";
}

function focusCards(){
  if(!S.races || !S.races.length) return "";
  const now = Date.now();
  const wr = thisWeekRace();
  if(!wr) return "";
  const nr = S.races.find(x => x.round === wr.round + 1) || null;

  // ---------- 本周 ----------
  const ss = raceSessions(wr);
  const liveS = ss.find(x => x.st === "live");
  const nextS = ss.find(x => x.s > now);
  const allDone = ss.length > 0 && ss.every(x => x.st === "done");

  let sub = "";
  if(liveS)        sub = "正在进行 · " + liveS.label;
  else if(nextS)   sub = "下一场 " + nextS.label + " · 还有 " + countdownText(nextS.s - now);
  else if(allDone) sub = "本站已结束";
  if(!S.results[wr.round] && allDone) sub += " · 成绩同步中";

  const sessHtml = ss.map(x => {
    const cls = x.st === "live" ? "live" : (x.st === "done" ? "done" : "");
    const tail = x.st === "live" ? "进行中" : (x.st === "done" ? "已结束" : countdownText(x.s - now));
    return '<span class="' + cls + '"><i>' + esc(x.label) + '</i>' + esc(fmtSession(x.iso)) + ' · <b>' + esc(tail) + '</b></span>';
  }).join("");

  const cardNow = '<div class="fcard now" data-jump="' + wr.round + '">' +
    '<div class="ftag">本周比赛 · 第 ' + wr.round + ' 站</div>' +
    '<div class="fname">' + flagImg(wr) + esc(raceCN(wr)) +
      (wr.sessions && wr.sessions.sprint ? '<span class="badge">冲刺</span>' : "") + '</div>' +
    '<div class="fmeta">' + esc(wr.circuit || "") + ' · ' + esc(wr.location || "") +
      (sub ? '<br>' + esc(sub) : "") + '</div>' +
    (sessHtml ? '<div class="fsess">' + sessHtml + '</div>' : '') +
    '</div>';

  // ---------- 下一站 ----------
  let cardNext;
  if(nr){
    const t = nr.times && nr.times.race;
    const tms = t ? new Date(t).getTime() : null;
    const tail = (tms && tms > now) ? "还有 " + countdownText(tms - now) : "";
    const nss = raceSessions(nr).map(x =>
      '<span><i>' + esc(x.label) + '</i>' + esc(fmtSession(x.iso)) + '</span>').join("");
    cardNext = '<div class="fcard" data-jump="' + nr.round + '">' +
      '<div class="ftag">下一站 · 第 ' + nr.round + ' 站</div>' +
      '<div class="fname">' + flagImg(nr) + esc(raceCN(nr)) +
        (nr.sessions && nr.sessions.sprint ? '<span class="badge">冲刺</span>' : "") + '</div>' +
      '<div class="fmeta">' + esc(nr.circuit || "") + ' · ' + esc(nr.location || "") +
        (t ? '<br>正赛 ' + esc(fmtSession(t)) : '') + (tail ? ' · ' + tail : '') + '</div>' +
      (nss ? '<div class="fsess">' + nss + '</div>' : '') +
      '</div>';
  } else {
    cardNext = '<div class="fcard"><div class="ftag">下一站</div>' +
      '<div class="fmeta">本赛季赛程已全部结束</div></div>';
  }

  return '<div class="focus">' + cardNow + cardNext + '</div>';
}

function bindFocus(){
  document.querySelectorAll("#raceList .fcard[data-jump]").forEach(el => {
    el.onclick = () => { switchTab("results"); showRound(Number(el.dataset.jump)); };

/* 焦点区里的倒计时每 60 秒自己刷新一次，不用手动点「刷新数据」。
   只替换 .focus 这一块，不重建整个赛程列表。 */
function tickFocus(){
  const el = document.querySelector("#raceList .focus");
  if(!el || !S.races || !S.races.length) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = focusCards();
  const fresh = tmp.firstElementChild;
  if(fresh){ el.replaceWith(fresh); bindFocus(); }
}
setInterval(tickFocus, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) tickFocus(); });

/* =========================================================
   渲染：成绩表
   ========================================================= */
/* 阶段的中文名和顺序（按比赛周末的时间先后） */
const STAGE_ORDER = [
  { kind: "sprintq", label: "冲刺排位", en: "Sprint Qualifying", colour: "var(--blue)" },
  { kind: "sprint",  label: "冲刺赛",   en: "Sprint",            colour: "var(--gold)" },
  { kind: "quali",   label: "排位赛",   en: "Qualifying",        colour: "var(--red)"  },
  { kind: "race",    label: "正赛",     en: "Grand Prix",        colour: "var(--green)" }
];
const STAGE_LABEL = {};
STAGE_ORDER.forEach(function(s){ STAGE_LABEL[s.kind] = s.label; });

/* 某个阶段没有成绩时，要说清是哪种"没有"。
   以前一律显示「本站无此阶段数据」，结果新加坡站（周六周日才跑）
   看起来像数据源坏了。四种情况分开：
     none    本站根本没有这个阶段（传统赛制没有冲刺）
     future  还没开始
     live    正在进行
     pending 已经结束，成绩还在同步
     nosrc   备用数据源不提供这个阶段的成绩 */
function emptyStateFor(r, kind){
  const label = STAGE_LABEL[kind] || kind;
  const iso = r && r.times ? r.times[kind] : null;

  if(!iso){
    // 阶段存在但时间未知（冲刺排位可能这样）—— 不能说成「本站没有」
    if(r && hasStage(r, kind))
      return { cls: "pending", text: "本站有" + label + "，但当前数据源没有给出时间与成绩" };
    return { cls: "none", text: "本站没有" + label + "（传统赛制周末）" };
  }

  const s = new Date(iso).getTime();
  if(isNaN(s)) return { cls: "none", text: "本站没有" + label };

  const e = (typeof sessionEndMs === "function" ? sessionEndMs(r, kind) : null) || (s + 3600000);
  const now = Date.now();

  if(now < s)  return { cls: "future",  text: "尚未开始 · " + fmtSession(iso) };
  if(now < e)  return { cls: "live",    text: "正在进行中 · " + fmtSession(iso) };
  if(kind === "sprintq" && S.source === "jolpica")
    return { cls: "pending", text: "已结束 · 备用数据源不提供冲刺排位成绩" };
  return { cls: "pending", text: "已结束，成绩同步中 · 通常赛后几分钟到几小时" };
}

function sessionTable(rows, kind, meetingKey, race){
  if(!rows || !rows.length){
    const st = emptyStateFor(race, kind);
    return '<div class="card"><div class="msg ' + st.cls + '">' + esc(st.text) + '</div></div>';
  }
  const isRace = kind === "race" || kind === "sprint";

  const head = `<tr>
    <th style="width:52px">名次</th>
    <th>车手</th>
    <th class="hide-m">车队</th>
    ${isRace ? '<th class="hide-m" style="width:60px">圈数</th>' : ""}
    <th>${isRace ? "成绩 / 状态" : "最快圈"}</th>
    ${isRace ? '<th style="text-align:right;width:70px">积分</th>' : ""}
  </tr>`;

  let shown = 0;
  const body = rows.map(r => {
    const d = driverOf(meetingKey, r.driver_number) || {};
    const col = d.colour || "#7a8296";
    const st = statusText(r);
    const pos = r.position ?? (st ? "—" : ++shown);
    /* pd 是给「没有名次」的行用的（灰色 + 小两号字，原本是给那个破折号配的）。
       以前只要 dnf/dns/dsq 为真就套上，结果有名次的行字号也从 15px 掉到 13px，
       看起来就像"这两个数字字体不一样"。有名次就正常显示。 */
    const cls = pos === 1 ? "p1" : pos === 2 ? "p2" : pos === 3 ? "p3"
              : (!r.position && st ? "pd" : "");

    let cell;
    if(isRace){
      const total = fmtDuration(r.duration);
      if(st){
        cell = '<span class="muted">' + esc(st) + '</span>';
      } else if(r.position === 1 && total){
        cell = '<span class="num">' + esc(total) + '</span>';
      } else {
        const gap = gapCellOf(r);
        if(gap)          cell = '<span class="num">' + esc(gap) + '</span>';
        else if(total)   cell = '<span class="num">' + esc(total) + '</span>';
        else             cell = '<span class="muted">—</span>';
      }
    } else {
      const arr = Array.isArray(r.duration) ? r.duration : [];
      const best = arr.filter(x => typeof x === "number").pop();
      cell = best != null ? '<span class="num">' + esc(fmtDuration(best)) + '</span>' : '<span class="muted">—</span>';
    }

    return `<tr>
      <td class="pos ${cls}">${esc(pos)}</td>
      <td>${driverCell(meetingKey, r.driver_number)}</td>
      <td class="hide-m">${teamCell(meetingKey, r.driver_number)}</td>
      ${isRace ? `<td class="num hide-m">${esc(dash(r.number_of_laps))}</td>` : ""}
      <td>${cell}</td>
      ${isRace ? `<td class="pts">${r.points > 0 ? esc(r.points) : '<span class="muted">0</span>'}</td>` : ""}
    </tr>`;
  }).join("");

  return `<div class="card"><div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
}

/* 这个阶段在不在这个周末里。
   用它决定渲染哪几块和赛程行显示哪几行 ——
   两个都不能看「有没有成绩」：还没开跑的阶段会整块消失，
   新加坡站截图里冲刺赛和冲刺排位一起不见就是这个原因。
   冲刺排位另加一层兜底：不是每个数据来源都给它的时间，
   但 F1 的规则是「有冲刺赛的周末必定有冲刺排位」，用冲刺赛推断。 */
function hasStage(r, kind){
  if(!r || !r.times) return false;
  if(r.times[kind]) return true;
  if(kind === "sprintq") return !!r.times.sprint;
  return false;
}

function stageBlocks(r, round, mk){
  const bucketOf = function(k){
    if(k === "race")   return S.results;
    if(k === "quali")  return S.quali;
    if(k === "sprint") return S.sprint;
    return S.sprintq;
  };
  return STAGE_ORDER
    .filter(function(st){ return hasStage(r, st.kind); })
    .map(function(st){
      const bucket = bucketOf(st.kind) || {};
      return '<div class="sess">' +
        '<div class="sess-h"><span class="ln" style="background:' + st.colour + '"></span>' +
          esc(st.label) + ' ' + esc(st.en) +
          '<span class="muted">' + esc(r.times[st.kind] ? fmtSession(r.times[st.kind]) : "时间待定") + '</span></div>' +
        sessionTable(bucket[round], st.kind, mk, r) +
      '</div>';
    }).join("");
}

function showRound(round){
  const r = S.races.find(x => x.round === round);
  if(!r) return;
  const mk = r.meeting_key;

  $("#resultsList").classList.add("hide");
  const d = $("#roundDetail");
  d.classList.remove("hide");

  d.innerHTML = `
    <button class="back" id="backBtn">‹ 返回比赛列表</button>
    <div class="card" style="margin-bottom:20px">
      <div class="card-h" style="font-size:16px">
        ${flagImg(r)} 第 ${esc(r.round)} 站 · ${esc(raceCN(r))}
        <span class="muted">${esc(r.name)} · ${esc(r.circuit || "")}</span>
      </div>
      <div style="padding:10px 18px 12px">${sessionLines(r)}</div>
    </div>
    ${stageBlocks(r, round, mk)}`;

  $("#backBtn").onclick = () => {
    d.classList.add("hide");
    $("#resultsList").classList.remove("hide");
  };
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================================================
   赛季切换
   ---------------------------------------------------------
   这个工具打算用很多年，所以年份不能写死。
   切换时要把所有跟年份有关的东西都换掉：
   内存缓存、预取包副本、当前数据、本地缓存（按年份分开存）。
   ========================================================= */
function renderYearSwitcher(){
  const lbl = document.getElementById("yLabel");
  if(lbl) lbl.textContent = YEAR;
  const p = document.getElementById("yPrev"), n = document.getElementById("yNext");
  if(p) p.disabled = YEAR <= SEASON_MIN;
  if(n) n.disabled = YEAR >= seasonMax();
  const sub = document.getElementById("subTitle");
  if(sub) sub.textContent = YEAR + " 赛季 · 赛程 / 排位 / 冲刺 / 正赛 / 积分榜";
  /* 这两处原来都写死了 2026 —— 切到 2023 时数据对了、标题还写着 2026。 */
  document.title = "F1 赛事助手 · " + YEAR;
  const st = document.getElementById("seasonTitle");
  if(st) st.textContent = YEAR + " 赛季赛程";
}

async function setYear(y){
  if(y < SEASON_MIN || y > seasonMax() || y === YEAR) return;
  console.log("[F1助手] 切换赛季：" + YEAR + " → " + y);
  YEAR = y;
  try{ localStorage.setItem(YEAR_KEY, String(y)); }catch(e){}

  _cache.clear();                              // 内存请求缓存
  _pfData = null; _pfAt = 0; _pfWarned = false; // 预取包（要按新年份重读）

  // 只重置数据字段，不动 S 的结构
  S.races = []; S.drivers = {};
  S.results = {}; S.quali = {}; S.sprint = {}; S.sprintq = {};
  S.ds = []; S.cs = []; S.failed = [];
  S.loaded = false; S.source = null;
  S.standingsRound = null; S.standingsMeeting = null;

  // 先清空内存缓存，再读新年份的本地缓存（每个赛季各存各的键）
  clearStore();
  loadStore();

  renderYearSwitcher();
  await boot(true);
}

async function boot(force){
  /* 点「刷新数据」时必须把本地缓存的 TTL 也清掉。
     以前只清内存缓存，赛程仍走 3 天的 localStorage 缓存 →
     刚跑完的排位赛成绩永远刷不出来。 */
  if(force){
    _cache.clear(); S.loaded = false; S.source = null;
    _store.meetingsAt = 0; _store.sessionsAt = 0; _store.driversAt = 0;
  }
  const bar = txt => {
    $("#raceList").innerHTML = `<div class="msg">${esc(txt)}</div>`;
    $("#resultsList").innerHTML = `<div class="msg">${esc(txt)}</div>`;
  };
  const progress = (d, total, label) => {
    $("#prog").textContent = `加载中 ${Math.round(d / total * 100)}%`;
    bar(`正在${label || "获取数据"}…`);
  };
  // 赛程一拿到就先渲染出来，用户不用干等后面的数据
  const onScheduleReady = () => { renderSeason(); renderResultsList(); };

  try{
    if(!S.loaded){
      bar("正在获取赛程…");
      try{
        await loadAll(progress, onScheduleReady);
      }catch(e1){
        /* OpenF1 挂了。最常见的不是网络问题，而是比赛进行期间它把整个 API
           锁掉（401 "Live F1 session in progress"）—— 而那正好是用户最想
           查成绩的时候。所以不能直接报错，要换备用源。 */
        console.warn("[F1助手] OpenF1 失败，切换备用源：", e1.message);
        bar("主数据源不可用，正在切换备用源…");
        try{
          await loadFromJolpica(progress);
        }catch(e2){
          console.warn("[F1助手] Jolpica 也失败，退回本地缓存：", e2.message);
          const snap = loadSnapshot();
          if(!snap) throw e1;                 // 三个都没有，才真的没辙
          applySnapshot(snap);
          bar("两个数据源都连不上，正在显示本地缓存…");
        }
      }
    }
    // 上游还没同步的场次，用官方数据补上（读不到就跳过，不影响其他功能）
    try{ await fillFromOfficial(); }catch(e){}

    bar("正在整理数据…");
    renderSeason();
    renderResultsList();
    renderStandings();
    const ts = $("#stamp");
    if(ts) ts.textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  }catch(e){
    const m = `<div class="msg err">数据加载失败：${esc(e.message)}<br><br>
      OpenF1 在 F1 比赛进行期间会锁站（属正常现象），此时备用源也会被尝试；
      若已过比赛时段，请等 1 分钟后点「刷新数据」重试。</div>`;
    $("#raceList").innerHTML = m;
    $("#resultsList").innerHTML = m;
    console.error(e);
  }
}

$("#refresh").onclick = async () => {
  const b = $("#refresh");
  b.disabled = true; b.textContent = "刷新中…";
  await boot(true);
  b.disabled = false; b.textContent = "刷新数据";
};

/* 顶栏赛季切换 */
document.getElementById("yPrev").onclick = function(){ setYear(YEAR - 1); };
document.getElementById("yNext").onclick = function(){ setYear(YEAR + 1); };
renderYearSwitcher();

boot(false);

/* =========================================================
   注册 Service Worker
   ---------------------------------------------------------
   Chrome 判断一个页面「能不能装成 app」有硬性要求，其中一条是
   【必须有带 fetch 事件处理的 Service Worker】。
   没有它，「添加到主屏幕」只会创建一个书签 —— 点开还是浏览器（带地址栏）；
   有了它，Chrome 才会装成 WebAPK：独立图标、独立全屏窗口、任务切换里像个 app。

   顺带好处：静态文件会被缓存，第二次打开几乎瞬开。

   file:// 打开时不注册（浏览器不允许 Service Worker 跑在 file 协议下）。
   ========================================================= */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(() => console.log("[F1助手] Service Worker 已注册 —— 可以从浏览器菜单「安装应用 / 添加到主屏幕」了"))
      .catch(e => console.warn("[F1助手] Service Worker 注册失败（不影响使用）：", e.message));
  });
}

</script>
