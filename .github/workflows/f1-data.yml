# 每 10 分钟抓一次 F1 数据，存成静态 JSON 供前端读取
#
# 背景：
#   F1 官方 live timing（livetiming.formula1.com）数据最全、无限流，
#   但它【没有 CORS】（浏览器调不到），而且【会 403 拒绝云服务器 IP】
#   —— 2026-10-03 实测：GitHub runner 请求它返回 HTTP 403。
#   所以本 workflow 会先探测哪些源从 GitHub 服务器可达，再决定抓哪个。
#
# 产出：data/f1.json（给前端用）、data/probe.txt（数据源探测报告）

name: F1 data relay

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 探测各数据源从 GitHub 服务器能不能连上。
      # 结果写进 data/probe.txt 并提交，这样不用看日志也能知道结论。
      - name: 探测数据源可达性
        run: |
          mkdir -p data
          {
            echo "探测时间(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "出口 IP      : $(curl -s --max-time 10 https://api.ipify.org || echo '取不到')"
            echo ""
            echo "===== 各数据源可达性 ====="
            probe() {
              printf '%-52s ' "$2"
              curl -sS -o /tmp/p.out -w "HTTP %{http_code}  %{time_total}s  %{size_download} 字节\n" \
                --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$1" 2>/dev/null \
                || echo "curl 失败(退出码 $?)"
            }
            probe "https://livetiming.formula1.com/static/2026/Index.json" "官方 live timing（已测 403）"
            probe "https://www.formula1.com/en/results/2026/races"          "F1 官网成绩页"
            probe "https://www.formula1.com/en/racing/2026.html"            "F1 官网赛程页"
            probe "https://api.openf1.org/v1/sessions?session_key=11730"    "OpenF1"
            probe "https://api.jolpi.ca/ergast/f1/2026/races.json?limit=1"  "Jolpica"
            probe "https://f1api.dev/api/2026"                              "f1api.dev"
            probe "https://raw.githubusercontent.com/13272045373/F1/main/index.html" "GitHub raw（对照）"
            echo ""
            echo "===== F1 官网成绩页内容检查 ====="
            curl -sS --max-time 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              "https://www.formula1.com/en/results/2026/races" -o /tmp/f1.html 2>/dev/null || true
            if [ -s /tmp/f1.html ]; then
              echo "  抓到 $(wc -c < /tmp/f1.html) 字节"
              for k in Sepang Malaysia Kuala Verstappen Hamilton Qualifying; do
                printf '  关键词 %-12s 出现 ' "$k"
                grep -o -i "$k" /tmp/f1.html 2>/dev/null | wc -l
              done
            else
              echo "  没抓到内容"
            fi
          } > data/probe.txt 2>&1
          cat data/probe.txt

      - name: 检查脚本
        run: |
          echo "当前目录内容："
          ls -la
          if [ ! -f fetch-f1.mjs ]; then
            echo "::error title=找不到 fetch-f1.mjs::仓库根目录下没有 fetch-f1.mjs。请确认文件名带 .mjs 后缀。"
            exit 1
          fi
          echo "✅ 找到 fetch-f1.mjs"

      - name: 抓取数据（预取 OpenF1）
        env:
          F1_YEAR: "2026"
          F1_OUT: "data/f1.json"
          F1_MAX_SESSIONS: "40"
        run: node fetch-f1.mjs

      # 不管上面成没成功，都要把探测报告提交上去 —— 那是排查的依据
      - name: 提交产出（无论成败）
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add -A data/
            git commit -m "chore(f1): 更新数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "已提交："
            git show --stat --oneline HEAD
          else
            echo "data/ 无变化，跳过提交"
          fi
