# 每 10 分钟抓一次 F1 官方数据，存成静态 JSON 供前端读取
#
# 放在仓库的 .github/workflows/ 目录下。
# 产出 data/f1.json，前端从 raw.githubusercontent.com 读（raw 有 CORS，官方源没有）。
#
# 注意：
#   · 定时任务只在【默认分支】上生效
#   · GitHub 的 schedule 实际会有几分钟延迟，属正常
#   · 本 workflow 会自己 commit，仓库保持活跃，不会被自动停用

name: F1 data relay

on:
  schedule:
    # GitHub 最短 5 分钟，但排队会延迟；10 分钟是更实际的间隔
    - cron: "*/10 * * * *"
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下跑

permissions:
  contents: write           # 需要写权限才能 commit

concurrency:
  group: f1-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"      # 20 已被 GitHub 标记为 deprecated

      # 先诊断一下 GitHub 的服务器到底能不能连上 F1 官方 CDN。
      # 上一次"跑成功却没产出"，就是因为连不上、而脚本把错误吞掉了。
      # 有了这一步，日志第一屏就能看出问题。
      - name: 诊断：能不能连上官方源
        run: |
          echo "===== DNS ====="
          getent hosts livetiming.formula1.com || echo "❌ DNS 解析失败"
          echo ""
          echo "===== 取年度索引 ====="
          curl -sS -o /tmp/idx.json -w "HTTP %{http_code}  用时 %{time_total}s  大小 %{size_download} 字节\n" \
            --max-time 40 "https://livetiming.formula1.com/static/2026/Index.json" \
            || echo "❌ curl 失败（退出码 $?）"
          echo ""
          if [ -s /tmp/idx.json ]; then
            echo "===== 内容开头 ====="
            head -c 300 /tmp/idx.json; echo ""
          fi

      # 先自己检查一遍脚本在不在。
      # 上一次失败就是因为文件名漏了 .mjs（仓库里叫 fetch-f1），
      # 而 node 对没有后缀的文件会按 CommonJS 解析，import 语句直接报错。
      # 与其让它报一句看不懂的错，不如在这里把目录列出来。
      - name: 检查脚本
        run: |
          echo "当前目录内容："
          ls -la
          if [ ! -f fetch-f1.mjs ]; then
            echo "::error title=找不到 fetch-f1.mjs::仓库根目录下没有 fetch-f1.mjs。请确认文件名带 .mjs 后缀（不能是 fetch-f1）。"
            exit 1
          fi
          echo "✅ 找到 fetch-f1.mjs"
          ls -l fetch-f1.mjs

      - name: 抓取官方数据
        env:
          F1_YEAR: "2026"
          F1_OUT: "data/f1.json"
          F1_MAX_SESSIONS: "40"
        run: node fetch-f1.mjs

      - name: 确认产出
        run: |
          if [ ! -f data/f1.json ]; then
            echo "::error title=没有产出 data/f1.json::脚本跑完了但没生成文件，请看上一步的日志。"
            exit 1
          fi
          echo "产出大小：$(du -h data/f1.json | cut -f1)"
          node -e "const j=require('./data/f1.json');console.log('场次数:',j.count,' 更新时间:',j.updated);console.log('包含的 session key:',Object.keys(j.sessions).join(', '))"

      - name: 有变化就提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/f1.json)" ]; then
            git add data/f1.json
            git commit -m "chore(f1): 更新官方数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "已提交"
          else
            echo "数据无变化，跳过提交"
          fi
